<title>Assistente de Angariação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: barra azul-marinho fixa no topo com separadores; área de trabalho numa coluna legível; navegação inferior no telemóvel */
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --ink:#14213D; --muted:#5A6377; --line:#DCE1EA;
  --navy:#12233F; --navy-ink:#F4F6FA; --gold:#B8892B; --gold-ink:#7E5B12; --gold-soft:#F4EAD3;
  --blue:#2B5797; --blue-soft:#E3ECF8; --grey-soft:#ECEEF2; --warn:#A8461F; --warn-soft:#FBE9E1; --ok:#2E7A52; --ok-soft:#E2F2E9;
  --mark:#FFF1C9; --mark-ink:#5E4100;
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1424; --surface:#131E33; --surface-2:#1A2740; --ink:#E7EBF3; --muted:#9BA6BC; --line:#25314B;
  --navy:#09111F; --navy-ink:#EEF1F7; --gold:#D6AB52; --gold-ink:#E7C47C; --gold-soft:#33291A;
  --blue:#8DB2EA; --blue-soft:#1C2B47; --grey-soft:#1E2840; --warn:#F09A76; --warn-soft:#3A2119; --ok:#7FCFA2; --ok-soft:#173527;
  --mark:#4A3A14; --mark-ink:#FBE3A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1424; --surface:#131E33; --surface-2:#1A2740; --ink:#E7EBF3; --muted:#9BA6BC; --line:#25314B;
  --navy:#09111F; --navy-ink:#EEF1F7; --gold:#D6AB52; --gold-ink:#E7C47C; --gold-soft:#33291A;
  --blue:#8DB2EA; --blue-soft:#1C2B47; --grey-soft:#1E2840; --warn:#F09A76; --warn-soft:#3A2119; --ok:#7FCFA2; --ok-soft:#173527;
  --mark:#4A3A14; --mark-ink:#FBE3A6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink);border-bottom:2px solid var(--gold)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:30px;height:30px;flex:none}
.brand h1{font-size:17px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--navy-ink);border-radius:8px;padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.icon-btn:hover{border-color:var(--gold)}
.tabs{display:flex;gap:2px}
.tab{background:transparent;border:0;color:rgba(244,246,250,.72);padding:8px 12px;border-radius:8px;font-weight:500;font-size:14px;white-space:nowrap}
.tab[aria-current="page"]{color:var(--navy-ink);background:rgba(255,255,255,.08);box-shadow:inset 0 -2px 0 var(--gold)}
.tab:hover{color:var(--navy-ink)}
.bottom-nav{display:none}
@media (max-width:760px){
  .top .tabs{display:none}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);border-top:2px solid var(--gold);
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottom-nav .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px}
  .bottom-nav .tab svg{width:20px;height:20px}
  main{padding-bottom:84px}
}
.bottom-nav .tab svg,.tabs .tab svg{display:block}
.tabs .tab svg{display:none}

/* Estrutura geral */
main .wrap{padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.view-head{display:flex;flex-direction:column;gap:6px}
.view-head h2{font-size:26px;font-weight:600}
.view-head p{margin:0;color:var(--muted);max-width:65ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--gold-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:#1B1305;border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold);color:#1B1305;border-color:var(--gold)}}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:#1B1305;border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#1B1305;border-color:var(--gold)}}
.btn.ghost{background:transparent}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Badges de origem */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-form{background:var(--gold-soft);color:var(--gold-ink)}
.b-adapt{background:var(--blue-soft);color:var(--blue)}
.b-comp{background:var(--grey-soft);color:var(--muted)}
.b-src{background:transparent;color:var(--muted);border:1px solid var(--line)}
.b-warn{background:var(--warn-soft);color:var(--warn)}

/* Dados da situação */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.panel>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .chev{margin-left:auto;transition:transform .15s}
details.panel[open]>summary .chev{transform:rotate(180deg)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:0 14px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}

/* Cartões de guião */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.card>summary::-webkit-details-marker{display:none}
.card>summary h3{font-size:16px;font-weight:600}
.card>summary .when{grid-column:1/2;color:var(--muted);font-size:13px}
.card>summary .meta{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.card[open]>summary{border-bottom:1px solid var(--line)}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.say{border-left:3px solid var(--gold);background:var(--surface-2);padding:10px 12px;border-radius:0 8px 8px 0;white-space:pre-line}
.say .who{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);font-weight:600;margin-bottom:2px}
.note{font-size:13px;color:var(--muted);padding-left:15px;position:relative}
.note::before{content:"";position:absolute;left:3px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--muted)}
mark.ph{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 3px}
mark.ph.empty{font-style:italic}
.keys{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.callout{border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--blue-soft);color:var(--blue)}
.callout.ok{background:var(--ok-soft);color:var(--ok)}
.callout b{font-weight:600}
.callout svg{flex:none;margin-top:2px}
.sub{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Objeções */
.obj-q{font-family:var(--f-display);font-size:17px;font-weight:600}
.obj-q::before{content:"\201C"}.obj-q::after{content:"\201D"}

/* Checklist */
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.phase>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
.phase>summary::-webkit-details-marker{display:none}
.phase-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:14px;flex:none}
.phase.done .phase-num{background:var(--ok);color:#fff}
.phase-title{flex:1;min-width:0}
.phase-title h3{font-size:16px;font-weight:600}
.phase-title span{font-size:13px;color:var(--muted)}
.phase-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.checks{list-style:none;margin:0;padding:0 16px 14px;display:flex;flex-direction:column}
.check{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--gold)}
.check label{flex:1;min-width:0;cursor:pointer}
.check .t{font-weight:500}
.check .d{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-line}
.check input:checked+label .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.check .badge{margin-left:4px;vertical-align:1px}

/* Treino */
.train-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.mode[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mode h3{font-size:16px;font-weight:600}
.mode span{font-size:13px;color:var(--muted)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.stage-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.scenario{font-size:16px;font-weight:500}
.options{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.bubble{background:var(--surface-2);border-radius:12px 12px 12px 2px;padding:10px 14px;max-width:85%;align-self:flex-start}
.bubble .who{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bubble.me{align-self:flex-end;border-radius:12px 12px 2px 12px;background:var(--gold-soft);color:var(--ink)}
.bubble.me .who{color:var(--gold-ink)}
.chat{display:flex;flex-direction:column;gap:8px}
.fb{font-size:13.5px;border-radius:8px;padding:8px 12px}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--warn-soft);color:var(--warn)}
.fb.mid{background:var(--blue-soft);color:var(--blue)}
textarea{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.score{font-family:var(--f-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}

/* Método */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.principle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.principle h4{font-size:15px;font-weight:600}
.principle p{margin:0;font-size:14px}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.funnel-row{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.funnel-bar{height:22px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.funnel-bar i{display:block;height:100%;background:var(--navy)}
:root[data-theme="dark"] .funnel-bar i{background:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .funnel-bar i{background:var(--gold)}}
.funnel-row b{font-variant-numeric:tabular-nums;text-align:right}
.dont{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.dont li{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14px}
.dont li b{display:block;font-weight:600}
.section{display:flex;flex-direction:column;gap:10px}
.section>h3{font-size:19px;font-weight:600}

/* Painel dos meus dados */
.sheet-bg{position:fixed;inset:0;background:rgba(6,12,24,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 16px}
.sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 80px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.sheet .fields{padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30;border:1px solid var(--gold)}
@media (min-width:761px){.toast{bottom:24px}}
.confirm-inline{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.empty{padding:20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.ed-sheet{width:min(720px,100%)}
.ed-form{display:flex;flex-direction:column;gap:14px}
.ed-form textarea{min-height:0}
.ed-form select,.ed-form input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.ed-list{display:flex;flex-direction:column;gap:8px}
.ed-row{display:flex;gap:6px;align-items:flex-start}
.ed-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ed-ctl{display:flex;flex-direction:column;gap:4px;flex:none}
.ed-mini{padding:4px 9px}
.ed-cause{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-cause .row input{min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .card>summary{grid-template-columns:1fr}
  .card>summary .meta{grid-row:auto;grid-column:1;flex-direction:row;align-items:center;flex-wrap:wrap}
  .funnel-row{grid-template-columns:95px 1fr 56px}
  .view-head h2{font-size:22px}
  #openMe span{display:none}
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="var(--gold)" stroke-width="2"/><path d="M8 17 16 9l8 8v7a1 1 0 0 1-1 1h-4v-5h-6v5H9a1 1 0 0 1-1-1z" fill="var(--gold)"/></svg>
      <div style="min-width:0"><small>Apoio à angariação</small><h1>Assistente de Angariação</h1></div>
    </div>
    <nav class="tabs" aria-label="Secções" id="tabsTop"></nav>
    <button class="icon-btn" id="openMe" type="button" aria-haspopup="dialog">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Os meus dados</span>
    </button>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>
<nav class="bottom-nav" aria-label="Secções" id="tabsBottom"></nav>
<div id="overlay"></div>

<script>

/* ---------- Fontes ---------- */
const SRC={"1.1":"Gravação 1.1","1.2":"Gravação 1.2","2.1":"Gravação 2.1","2.2":"Gravação 2.2","3.1":"Gravação 3.1","3.2":"Gravação 3.2","4":"Gravação 4","P1.1":"PNL 1.1","P1.2":"PNL 1.2","P2.1":"PNL 2.1","P2.2":"PNL 2.2","P3.1":"PNL 3.1","P3.2":"PNL 3.2","P4":"PNL 4"};
const TYPE={form:["b-form","Formação"],adapt:["b-adapt","Adaptação"],comp:["b-comp","Proposta complementar"],risk:["b-warn","Não recomendado"],own:["b-adapt","Texto próprio"]};
const PH={meuNome:"o seu nome",agencia:"agência",ami:"n.º licença AMI",telefone:"o seu telefone",zona:"zona",proprietario:"nome do proprietário",tipologia:"tipologia",urbanizacao:"urbanização / edifício",preco:"preço",hora1:"hora 1",hora2:"hora 2",dia:"data combinada"};

/* ---------- Guiões ---------- */
let SCRIPTS=[
{id:"frio",cat:"Telefone",t:"Primeiro contacto com proprietário particular",when:"Viu um anúncio de um particular e vai ligar pela primeira vez.",type:"form",src:["2.1","P1.1","P1.2"],
 steps:[
