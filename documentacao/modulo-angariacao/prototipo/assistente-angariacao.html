  const v=current();
  document.querySelectorAll("[data-view]").forEach(b=>b.dataset.view===v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  ({guioes:viewScripts,objecoes:viewObj,reuniao:viewMeeting,treino:viewTrain,metodo:viewMethod})[v]();
  window.scrollTo(0,0);
}

/* ---------- Painel de dados da situação ---------- */
function sitPanel(){
  const f=["proprietario","tipologia","zona","urbanizacao","preco","hora1","hora2","dia"];
  return `<details class="panel" id="sitPanel"${store.sitOpen?" open":""}><summary><span>Dados da situação</span><span class="muted small" style="font-weight:400">Os guiões preenchem-se com estes dados (exemplo)</span>${ICON.chev}</summary>
  <div class="fields">${f.map(k=>`<div class="field"><label for="sit-${k}">${PH[k][0].toUpperCase()+PH[k].slice(1)}</label><input id="sit-${k}" data-sit="${k}" value="${esc(store.sit[k]||"")}" autocomplete="off"></div>`).join("")}</div></details>`;
}
function bindSit(onChange){
  const p=$("#sitPanel");if(!p)return;
  p.addEventListener("toggle",()=>{store.sitOpen=p.open;save()});
  p.querySelectorAll("[data-sit]").forEach(i=>i.addEventListener("input",()=>{store.sit[i.dataset.sit]=i.value.trim();save();onChange()}));
}
function meNotice(){
  if(store.me.meuNome)return "";
  return `<div class="callout info">${ICON.info}<span>Preencha <b>Os meus dados</b> (nome, agência, licença AMI, telefone) para que os guiões e as cartas saiam com os seus dados.</span></div>`;
}

/* ---------- Vista: Guiões ---------- */
let scriptCat="Todos",scriptQ="";
function scriptHTML(s){
  const body=[];
  if(s.steps){body.push(`<ol class="steps">${s.steps.map(([k,t])=>k==="s"?`<li class="say"><span class="who">Diga</span>${fillHTML(t)}</li>`:`<li class="note">${fillHTML(t)}</li>`).join("")}</ol>`)}
  if(s.letter){body.push(`<div class="say"><span class="who">Texto da carta</span>${fillHTML(s.letter)}</div>`)}
  if(s.ifno){body.push(`<div class="callout info">${ICON.info}<span><b>Se recusar:</b> ${fillHTML(s.ifno)}</span></div>`)}
  if(s.keys){body.push(`<div><p class="sub">Pontos-chave</p><ul class="keys">${s.keys.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`)}
  if(s.warn){body.push(`<div class="callout warn">${ICON.warn}<span><b>${s.type==="risk"?"Riscos":"Cuidado"}:</b> ${esc(s.warn)}</span></div>`)}
  if(s.alt){body.push(`<div class="callout ok">${ICON.info}<span><b>Alternativa honesta:</b> ${fillHTML(s.alt)}</span></div>`)}
  body.push(`<div class="actions"><button class="btn" type="button" data-copy="${s.id}">${ICON.copy} Copiar texto</button>${editBtn("script",s.id)}</div>`);
  return `<details class="card" data-id="${s.id}"><summary><h3>${esc(s.t)}</h3><span class="when">${esc(s.when)}</span><span class="meta">${typeBadge(s.type)}${editedBadge("script",s.id)}<span class="badge b-src">${esc(s.cat)}</span></span></summary><div class="card-body">${body.join("")}<div class="row small muted">Fonte: ${srcBadges(s.src)}</div></div></details>`;
}
function scriptPlain(s){
  let out=s.t+"\n\n";
  if(s.steps)out+=s.steps.filter(x=>x[0]==="s").map(x=>fillText(x[1])).join("\n\n");
  if(s.letter)out+=fillText(s.letter);
  return out;
}
function viewScripts(){
  const cats=["Todos",...new Set(SCRIPTS.map(s=>s.cat))];
  $("#app").innerHTML=`<div class="view-head"><span class="eyebrow">Telefone, presencial, cartas e redes</span><h2>Guiões de abordagem</h2><p>Os textos seguem o discurso do formador e preenchem-se com os seus dados. Adapte-os à conversa real: são modelos, não cassetes.</p></div>
  ${meNotice()}${sitPanel()}
  <input class="search" id="q" type="search" placeholder="Procurar guião (ex.: carta, comprador, 30 dias)" value="${esc(scriptQ)}" aria-label="Procurar guião">
  <div class="row" role="group" aria-label="Categorias">${cats.map(c=>`<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c===scriptCat}">${esc(c)}</button>`).join("")}</div>
  <div class="row">${newBtn("script","Novo guião")}</div>
  <div class="list" id="list"></div>`;
  const draw=()=>{
    const open=[...document.querySelectorAll("#list details[open]")].map(d=>d.dataset.id);
    const q=scriptQ.toLowerCase();
    const items=SCRIPTS.filter(s=>(scriptCat==="Todos"||s.cat===scriptCat)&&(!q||JSON.stringify(s).toLowerCase().includes(q)));
    $("#list").innerHTML=items.length?items.map(scriptHTML).join(""):`<div class="empty">Nenhum guião encontrado.</div>`;
    open.forEach(id=>{const d=$(`#list details[data-id="${id}"]`);if(d)d.open=true});
    if(store.openScript){const d=$(`#list details[data-id="${store.openScript}"]`);if(d){d.open=true;d.scrollIntoView({block:"start"})}store.openScript=null}
  };
  draw();
  $("#q").addEventListener("input",e=>{scriptQ=e.target.value;draw()});
  document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{scriptCat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()}));
  $("#list").addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(b){copy(scriptPlain(SCRIPTS.find(s=>s.id===b.dataset.copy)),b)}});
  bindSit(draw);
}

/* ---------- Vista: Objeções ---------- */
let objQ="",objCtx="Todas";
function objPlain(o){
  let t=fillText(o.a);
  if(o.steps)t+="\n\n"+o.steps.map(s=>fillText(s)).join("\n\n");
  if(o.causes)t+="\n\n"+o.causes.map(c=>c.t.toUpperCase()+"\n"+c.steps.map(s=>fillText(s)).join("\n")).join("\n\n");
  return t;
}
function stepList(arr){return `<ol class="steps">${arr.map((s,i)=>`<li class="say"><span class="who">${i+1}.º passo</span>${fillHTML(s)}</li>`).join("")}</ol>`}
function viewObj(){
  const ctxs=["Todas","Telefone","Reunião","Comprador"];
  $("#app").innerHTML=`<div class="view-head"><span class="eyebrow">Respostas preparadas, com as técnicas de PNL</span><h2>Objeções frequentes</h2><p>Cada resposta começa por compreender e segue com perguntas, para a pessoa concluir sozinha. A origem está indicada: <span class="badge b-form">Formação</span> segue o formador, <span class="badge b-adapt">Adaptação</span> aplica o método a um caso que ele não tratou e <span class="badge b-comp">Proposta complementar</span> é uma sugestão minha.</p></div>
  <input class="search" id="oq" type="search" placeholder="Procurar objeção (ex.: comissão, placa, amigo, preço)" value="${esc(objQ)}" aria-label="Procurar objeção">
  <div class="row" role="group" aria-label="Momento">${ctxs.map(c=>`<button class="chip" type="button" data-ctx="${esc(c)}" aria-pressed="${c===objCtx}">${esc(c==="Todas"?"Todas":c==="Telefone"?"Ao telefone":c==="Reunião"?"Na reunião":"Com compradores")}</button>`).join("")}</div>
  <div class="row">${newBtn("obj","Nova objeção")}</div>
  <div class="list" id="olist"></div>`;
  const draw=()=>{
    const q=objQ.toLowerCase();
    const items=OBJ.filter(o=>(objCtx==="Todas"||o.ctx===objCtx)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));
    $("#olist").innerHTML=items.length?items.map(o=>`<details class="card" data-id="${o.id}"><summary><span class="obj-q">${esc(o.q)}</span><span class="meta">${typeBadge(o.type)}${editedBadge("obj",o.id)}<span class="badge b-src">${esc(o.ctx)}</span></span></summary>
     <div class="card-body"><div class="say"><span class="who">${o.causes?"Primeiro, descubra a causa":"Resposta"}</span>${fillHTML(o.a)}</div>
     ${o.steps?`<div><p class="sub">Se for preciso, continue com</p>${stepList(o.steps)}</div>`:""}
     ${o.causes?`<div><p class="sub">Depois, siga o caminho da causa</p><div class="list" style="margin-top:6px">${o.causes.map(c=>`<details class="phase"><summary><span class="phase-title"><h3>${esc(c.t)}</h3></span>${ICON.chev}</summary><div class="card-body" style="padding-top:0">${stepList(c.steps)}${c.note?`<p class="note" style="margin:0">${esc(c.note)}</p>`:""}</div></details>`).join("")}</div></div>`:""}
     <div><p class="sub">Porque funciona</p><p style="margin:4px 0 0">${esc(o.why)}</p></div>
     ${o.extra?`<div class="callout info">${ICON.info}<span>${esc(o.extra)}</span></div>`:""}
     ${o.next?`<div><p class="sub">Próximo passo</p><p style="margin:4px 0 0">${esc(o.next)}</p></div>`:""}
     ${o.warn?`<div class="callout warn">${ICON.warn}<span><b>Cuidado:</b> ${esc(o.warn)}</span></div>`:""}
     <div class="actions"><button class="btn" type="button" data-ocopy="${o.id}">${ICON.copy} Copiar texto</button>${editBtn("obj",o.id)}${o.script?`<button class="btn ghost" type="button" data-goscript="${o.script}">Abrir o guião completo</button>`:""}</div>
     <div class="row small muted">Fonte: ${srcBadges(o.src)}</div></div></details>`).join(""):`<div class="empty">Nenhuma objeção encontrada.</div>`;
  };
  draw();
  $("#oq").addEventListener("input",e=>{objQ=e.target.value;draw()});
  document.querySelectorAll("[data-ctx]").forEach(b=>b.addEventListener("click",()=>{objCtx=b.dataset.ctx;document.querySelectorAll("[data-ctx]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()}));
  $("#olist").addEventListener("click",e=>{
    const c=e.target.closest("[data-ocopy]");if(c){copy(objPlain(OBJ.find(o=>o.id===c.dataset.ocopy)))}
    const g=e.target.closest("[data-goscript]");if(g){store.openScript=g.dataset.goscript;scriptCat="Todos";scriptQ="";location.hash="guioes"}
  });
}

/* ---------- Vista: Reunião ---------- */
function viewMeeting(){
  const total=PHASES.reduce((n,p)=>n+p.items.length,0);
  $("#app").innerHTML=`<div class="view-head"><span class="eyebrow">Checklist da visita e reunião de angariação</span><h2>Reunião de angariação</h2><p>Siga as fases pela ordem do formador: preparar, criar relação na visita, dar razões à mesa e fechar. Os itens marcados ficam guardados neste dispositivo.</p></div>
  <div class="panel" style="padding:14px;display:flex;flex-direction:column;gap:8px">
   <div class="row" style="justify-content:space-between"><span><b id="pDone">0</b> de ${total} itens</span><span id="resetZone"><button class="btn ghost" type="button" id="resetBtn">Nova reunião (limpar)</button></span></div>
   <div class="progress" aria-hidden="true"><i id="pBar"></i></div></div>
  <div class="list" id="phases">${PHASES.map((p,pi)=>`<details class="phase" data-ph="${p.id}"${pi<2?" open":""}><summary><span class="phase-num">${pi+1}</span><span class="phase-title"><h3>${esc(p.t)}</h3><span>${esc(p.s)}</span></span><span class="phase-count" data-count="${p.id}"></span>${ICON.chev}</summary>
   <ul class="checks">${p.items.map((it,ii)=>{const id=p.id+"-"+ii;return `<li class="check"><input type="checkbox" id="ck-${id}" data-ck="${id}"${store.checks[id]?" checked":""}><label for="ck-${id}"><span class="t">${esc(it[0])}</span>${it[2]&&SRC[it[2]]?`<span class="badge b-src">${SRC[it[2]]}</span>`:""}${it[1]?`<span class="d">${esc(it[1])}</span>`:""}</label></li>`}).join("")}</ul>${canEditTexts?`<div class="actions" style="padding:0 16px 14px">${editBtn("phase",p.id,"Editar esta fase")}</div>`:""}</details>`).join("")}</div>
  <div class="row">${newBtn("phase","Nova fase")}</div>
  <div class="callout warn">${ICON.warn}<span><b>Matérias jurídicas:</b> os pontos de documentação e contrato resumem o que o formador disse nas gravações 3.1 e 3.2. Confirme-os em fontes oficiais atualizadas antes de os usar como regra.</span></div>`;
  const upd=()=>{
    let done=0;
    PHASES.forEach(p=>{const n=p.items.filter((_,i)=>store.checks[p.id+"-"+i]).length;done+=n;const el=$(`[data-count="${p.id}"]`);el.textContent=`${n}/${p.items.length}`;$(`[data-ph="${p.id}"]`).classList.toggle("done",n===p.items.length)});
    $("#pDone").textContent=done;$("#pBar").style.width=(done/total*100)+"%";
  };
  upd();
  $("#phases").addEventListener("change",e=>{const c=e.target.closest("[data-ck]");if(!c)return;if(c.checked)store.checks[c.dataset.ck]=1;else delete store.checks[c.dataset.ck];save();upd()});

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function runQuiz(){
  const order=shuffle(QUIZ.map((_,i)=>i));let idx=0,score=0;
  const st=$("#stage");

      st.innerHTML=`<div class="stage"><h3 style="font-size:20px">Resultado: ${score} de ${order.length}</h3><div class="fb ${pct>=.8?"good":pct>=.5?"mid":"bad"}">${pct>=.8?"Excelente: domina o método.":pct>=.5?"Bom caminho. Reveja as explicações das que falhou.":"Vale a pena rever os guiões e o separador Método."}</div><p class="muted small" style="margin:0">Melhor resultado neste dispositivo: ${store.quizBest} de ${order.length}</p><div class="actions"><button class="btn primary" type="button" id="again">Repetir</button></div></div>`;

function runSim(key){
  document.querySelectorAll("[data-sim]").forEach(b=>b.classList.toggle("primary",b.dataset.sim===key));
  const sim=SIMS[key];let node=sim.start,score=0,max=0;const log=[];
  const area=$("#simArea");
  const draw=()=>{
    const n=sim.nodes[node];const end=sim.ends[node];
    let h=`<div class="stage"><div class="stage-top"><span class="eyebrow">${esc(sim.t)}</span><span class="score">Pontos: ${score}</span></div><p class="muted small" style="margin:0">${esc(sim.intro)}</p><div class="chat">`;
    log.forEach(l=>{h+=l});
    if(end){
      h+=`</div><div class="fb ${end[0]}"><b>Fim da simulação.</b> ${esc(end[1])} Pontuação: ${score} de ${max}.</div><div class="actions"><button class="btn primary" type="button" id="simAgain">Repetir</button></div></div>`;
      area.innerHTML=h;$("#simAgain").onclick=()=>runSim(key);return;
    }
    h+=`<div class="bubble"><span class="who">Proprietário</span>${esc(n.say)}</div></div><p class="sub">O que responde?</p><div class="options">${n.ch.map((c,i)=>`<button class="opt" type="button" data-c="${i}">${fillHTML(c[0])}</button>`).join("")}</div></div>`;

const clone=x=>JSON.parse(JSON.stringify(x));
const BASE={
  script:clone(SCRIPTS),
  obj:clone(OBJ),
  phase:PHASES.map(p=>({id:p.id,t:p.t,s:p.s,items:p.items.map(i=>({t:i[0],d:i[1]||"",src:i[2]||""}))})),
  pnl:PNL.map((x,i)=>({id:"pnl"+i,t:x[0],p:x[1],src:x[2]})),
  princ:PRINCIPLES.map((x,i)=>({id:"pr"+i,t:x[0],p:x[1],src:x[2]})),
  dont:DONT.concat(DONT_PNL).map((x,i)=>({id:"d"+i,t:x[0],p:x[1]})),
  quiz:QUIZ.map((x,i)=>Object.assign({id:"q"+i},clone(x)))
};
let OV={};          /* {kind:{id:{data,deleted,custom,ts}}} */
let dbRef=null,userRef=null,canEditTexts=true,syncMode="local";
try{if(store.ov&&typeof store.ov==="object")OV=store.ov}catch(e){}
function eff(kind){
  const o=OV[kind]||{},out=[];
  BASE[kind].forEach(b=>{const r=o[b.id];if(r&&r.deleted)return;out.push(r&&r.data?Object.assign(clone(r.data),{id:b.id}):clone(b))});
  Object.keys(o).filter(id=>o[id].custom&&!o[id].deleted&&o[id].data).sort((a,b)=>(o[a].ts||0)-(o[b].ts||0)).forEach(id=>out.push(Object.assign(clone(o[id].data),{id})));
  return out;
}
function rebuild(){
  SCRIPTS=eff("script");
  OBJ=eff("obj");
  PHASES=eff("phase").map(p=>({id:p.id,t:p.t,s:p.s,items:(p.items||[]).map(i=>[i.t,i.d,i.src])}));
  PNL=eff("pnl").map(x=>[x.t,x.p,x.src||[]]);
  PRINCIPLES=eff("princ").map(x=>[x.t,x.p,x.src||[]]);
  DONT=eff("dont").map(x=>[x.t,x.p]);DONT_PNL=[];
  QUIZ=eff("quiz");
}
function findItem(kind,id){return eff(kind).find(x=>x.id===id)}
function isEdited(kind,id){const r=(OV[kind]||{})[id];return !!(r&&!r.custom&&r.data)}
function editBtn(kind,id,label){return canEditTexts?`<button class="btn ghost" type="button" data-edit="${kind}:${esc(id)}">${label||"Editar"}</button>`:""}
function newBtn(kind,label){return canEditTexts?`<button class="btn" type="button" data-new="${kind}">+ ${label}</button>`:""}
function editedBadge(kind,id){return isEdited(kind,id)?`<span class="badge b-src">Editado</span>`:((OV[kind]||{})[id]&&OV[kind][id].custom?`<span class="badge b-adapt">Texto próprio</span>`:"")}

async function persist(kind,id,rec){
  OV[kind]=OV[kind]||{};
  if(rec)OV[kind][id]=rec;else delete OV[kind][id];
  rebuild();
  if(dbRef){
    const ref=dbRef.doc("textos/"+kind+"__"+id);
    try{
      if(rec)await ref.set({kind,id,json:JSON.stringify(rec.data||null),deleted:!!rec.deleted,custom:!!rec.custom,ts:rec.ts||Date.now()});
      else await ref.delete();
    }catch(e){toast(e&&e.code==="quota_exceeded"?"Espaço de armazenamento cheio":"Não foi possível guardar. Tente de novo.");}
  }else{store.ov=OV;save()}
}

/* Esquemas dos formulários */
const KINDS={
  script:{label:"guião",fields:[["t","Título","text"],["cat","Categoria (ex.: Telefone, Presencial, Cartas)","text"],["when","Quando usar","area"],["steps","Passos: o que diz e notas","steps"],["letter","Texto de carta (opcional)","area"],["ifno","Se recusar (opcional)","area"],["keys","Pontos-chave (um por linha)","lines"],["warn","Cuidado (opcional)","area"],["alt","Alternativa honesta (opcional)","area"]]},
  obj:{label:"objeção",fields:[["q","O que o cliente diz","text"],["ctx","Momento","select",["Telefone","Reunião","Comprador"]],["a","Resposta ou primeira pergunta","area"],["steps","Passos seguintes (opcional)","list"],["causes","Caminhos por causa (opcional)","causes"],["why","Porque funciona","area"],["extra","Nota (opcional)","area"],["next","Próximo passo (opcional)","area"],["warn","Cuidado (opcional)","area"]]},
  phase:{label:"fase da checklist",fields:[["t","Nome da fase","text"],["s","Descrição curta","text"],["items","Itens","items"]]},
  pnl:{label:"princípio de comunicação",fields:[["t","Título","text"],["p","Texto","area"]]},
  princ:{label:"princípio",fields:[["t","Título","text"],["p","Texto","area"]]},
  dont:{label:"ponto a não aplicar",fields:[["t","Título","text"],["p","Texto","area"]]},
  quiz:{label:"pergunta de treino",fields:[["q","Situação ou pergunta","area"],["o","Opções de resposta","list"],["c","Número da opção certa (1, 2, 3…)","num"],["e","Explicação","area"]]}
};
const BLANK={
  script:{cat:"Os meus guiões",type:"own",src:[],t:"",when:"",steps:[["s",""]],keys:[]},
  obj:{ctx:"Telefone",type:"own",src:[],q:"",a:"",why:""},
  phase:{t:"",s:"",items:[{t:"",d:"",src:""}]},
  pnl:{t:"",p:"",src:[]},princ:{t:"",p:"",src:[]},dont:{t:"",p:""},
  quiz:{q:"",o:["",""],c:0,e:"",s:""}
};
const ta=(v,attr)=>`<textarea ${attr}>${esc(v||"")}</textarea>`;
const rowCtl=`<span class="ed-ctl"><button type="button" class="btn ghost ed-mini" data-up title="Subir">↑</button><button type="button" class="btn ghost ed-mini" data-del title="Remover">✕</button></span>`;
const ROW={
  list:v=>`<div class="ed-row">${ta(v,"data-item rows=\"3\"")}${rowCtl}</div>`,
  steps:(k,v)=>`<div class="ed-row"><div class="ed-col"><select data-kind><option value="s"${k==="s"?" selected":""}>Diga</option><option value="n"${k==="n"?" selected":""}>Nota</option></select>${ta(v,"data-item rows=\"3\"")}</div>${rowCtl}</div>`,
  items:(t,d,src)=>`<div class="ed-row" data-src="${esc(src||"")}"><div class="ed-col"><input data-it value="${esc(t||"")}" placeholder="Item">${ta(d,"data-id rows=\"2\" placeholder=\"Detalhe (opcional)\"")}</div>${rowCtl}</div>`,
  cause:c=>`<div class="ed-cause"><div class="row" style="justify-content:space-between"><input data-ct value="${esc(c.t||"")}" placeholder="Causa (ex.: quer rapidez)" style="flex:1">${rowCtl}</div><div class="ed-list" data-list="cs">${(c.steps||[]).map(ROW.list).join("")}</div><button type="button" class="btn ghost" data-add="list">+ Passo</button>${ta(c.note,"data-cn rows=\"2\" placeholder=\"Nota (opcional)\"")}</div>`
};
function fieldHTML(f,item){
  const [k,label,type,opts]=f,v=item[k];
  const lab=`<label>${esc(label)}</label>`;
  if(type==="text")return `<div class="field">${lab}<input data-f="${k}" value="${esc(v||"")}"></div>`;
  if(type==="num")return `<div class="field">${lab}<input data-f="${k}" type="number" min="1" step="1" value="${(v||0)+1}"></div>`;
  if(type==="area")return `<div class="field">${lab}${ta(v,`data-f="${k}" rows="4"`)}</div>`;
  if(type==="lines")return `<div class="field">${lab}${ta((v||[]).join("\n"),`data-f="${k}" data-lines rows="4"`)}</div>`;
  if(type==="select")return `<div class="field">${lab}<select data-f="${k}">${opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  if(type==="list")return `<div class="field">${lab}<div class="ed-list" data-list="${k}">${(v||[]).map(ROW.list).join("")}</div><button type="button" class="btn ghost" data-add="list">+ Acrescentar</button></div>`;
  if(type==="steps")return `<div class="field">${lab}<div class="ed-list" data-list="${k}">${(v||[]).map(s=>ROW.steps(s[0],s[1])).join("")}</div><button type="button" class="btn ghost" data-add="steps">+ Acrescentar passo</button></div>`;
  if(type==="items")return `<div class="field">${lab}<div class="ed-list" data-list="${k}">${(v||[]).map(i=>ROW.items(i.t,i.d,i.src)).join("")}</div><button type="button" class="btn ghost" data-add="items">+ Acrescentar item</button></div>`;
  if(type==="causes")return `<div class="field">${lab}<div class="ed-list" data-list="${k}">${(v||[]).map(ROW.cause).join("")}</div><button type="button" class="btn ghost" data-add="cause">+ Acrescentar caminho</button></div>`;
  return "";
}
function collect(kind,box,orig){
  const out=clone(orig);delete out.id;
  KINDS[kind].fields.forEach(([k,,type])=>{
    const clean=s=>(s||"").replace(/\r/g,"").trim();
    if(["text","area","select"].includes(type)){const v=clean(box.querySelector(`[data-f="${k}"]`).value);if(v||type==="text"||k==="a"||k==="q")out[k]=v;else delete out[k]}
    else if(type==="num"){out[k]=Math.max(0,(parseInt(box.querySelector(`[data-f="${k}"]`).value,10)||1)-1)}
    else if(type==="lines"){out[k]=clean(box.querySelector(`[data-f="${k}"]`).value).split("\n").map(s=>s.trim()).filter(Boolean)}
    else{
      const list=box.querySelector(`[data-list="${k}"]`);
      const rows=[...list.children];
      if(type==="list"){const a=rows.map(r=>clean(r.querySelector("[data-item]").value)).filter(Boolean);if(a.length)out[k]=a;else delete out[k]}
      if(type==="steps"){out[k]=rows.map(r=>[r.querySelector("[data-kind]").value,clean(r.querySelector("[data-item]").value)]).filter(s=>s[1])}
      if(type==="items"){out[k]=rows.map(r=>({t:clean(r.querySelector("[data-it]").value),d:clean(r.querySelector("[data-id]").value),src:r.dataset.src||""})).filter(i=>i.t)}
      if(type==="causes"){const a=rows.map(r=>{const c={t:clean(r.querySelector("[data-ct]").value),steps:[...r.querySelector('[data-list="cs"]').children].map(x=>clean(x.querySelector("[data-item]").value)).filter(Boolean)};const n=clean(r.querySelector("[data-cn]").value);if(n)c.note=n;return c}).filter(c=>c.t||c.steps.length);if(a.length)out[k]=a;else delete out[k]}
    }
  });
  if(kind==="quiz"&&out.o)out.c=Math.min(out.c,out.o.length-1);
  return out;
}
function openEditor(kind,id){
  const K=KINDS[kind];if(!K)return;
  const isNew=!id;const base=isNew?null:BASE[kind].find(b=>b.id===id);
  const rec=isNew?null:(OV[kind]||{})[id];
  const item=isNew?clone(BLANK[kind]):clone(findItem(kind,id)||{});
  if(!isNew&&!item)return;
  const last=document.activeElement;
  $("#overlay").innerHTML=`<div class="sheet-bg" id="sheetBg"><div class="sheet ed-sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
   <div class="row" style="justify-content:space-between"><h3 id="edTitle" style="font-size:19px">${isNew?"Novo "+K.label:"Editar "+K.label}</h3><button class="btn ghost" type="button" data-close>Fechar</button></div>
   <p class="muted small" style="margin:0">Pode usar os campos {meuNome}, {agencia}, {ami}, {telefone}, {proprietario}, {tipologia}, {zona}, {urbanizacao}, {preco}, {hora1}, {hora2} e {dia}: são preenchidos com os seus dados.</p>
   <form id="edForm" class="ed-form">${K.fields.map(f=>fieldHTML(f,item)).join("")}</form>
   <div class="actions" id="edActions"><button class="btn primary" type="button" data-save>Guardar</button>
    ${!isNew&&base&&rec&&rec.data?`<button class="btn ghost" type="button" data-reset>Repor original</button>`:""}
    ${!isNew?`<button class="btn ghost" type="button" data-remove>Apagar</button>`:""}</div>
   <p class="muted small" style="margin:0">${syncMode==="db"?"As alterações ficam guardadas na ferramenta e aparecem em todos os seus dispositivos.":"Neste momento as alterações ficam guardadas apenas neste navegador."}</p>
  </div></div>`;
  const box=$("#edForm"),sheet=$(".ed-sheet");
  const close=()=>{$("#overlay").innerHTML="";document.removeEventListener("keydown",onKey);if(last&&last.focus)try{last.focus()}catch(e){}};
  const onKey=e=>{if(e.key==="Escape")close()};
  sheet.addEventListener("click",async e=>{
    const t=e.target.closest("button");if(!t)return;
    if(t.hasAttribute("data-close")){close();return}
    if(t.dataset.add){const list=t.previousElementSibling;const ty=t.dataset.add;
      list.insertAdjacentHTML("beforeend",ty==="list"?ROW.list(""):ty==="steps"?ROW.steps("s",""):ty==="items"?ROW.items("","",""):ROW.cause({steps:[""]}));
      const f=list.lastElementChild.querySelector("textarea,input");if(f)f.focus();return}
    if(t.hasAttribute("data-del")){(t.closest(".ed-cause")&&!t.closest(".ed-row")?t.closest(".ed-cause"):t.closest(".ed-row")).remove();return}
    if(t.hasAttribute("data-up")){const r=t.closest(".ed-cause")&&!t.closest(".ed-row")?t.closest(".ed-cause"):t.closest(".ed-row");if(r.previousElementSibling)r.parentNode.insertBefore(r,r.previousElementSibling);return}
    if(t.hasAttribute("data-save")){
      const data=collect(kind,box,item);
      const req=K.fields[0][0];
      if(!data[req]){toast("Preencha o campo “"+K.fields[0][1]+"”");return}
      if(kind==="quiz"&&(!data.o||data.o.length<2)){toast("Uma pergunta precisa de pelo menos duas opções");return}
      const nid=isNew?("c"+Date.now().toString(36)):id;
      close();
      await persist(kind,nid,{data,custom:isNew||(!base),deleted:false,ts:isNew?Date.now():((rec&&rec.ts)||Date.now())});
      route();toast("Guardado");return}
    if(t.hasAttribute("data-reset")){close();await persist(kind,id,null);route();toast("Texto original reposto");return}
    if(t.hasAttribute("data-remove")){
      if(!t.dataset.confirm){t.dataset.confirm="1";t.textContent="Confirmar: apagar";t.classList.add("primary");return}
      close();
      if(base)await persist(kind,id,{data:null,deleted:true,custom:false,ts:Date.now()});else await persist(kind,id,null);
      route();toast("Apagado");return}
  });
  const f=box.querySelector("input,textarea");if(f)f.focus();
}
document.addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]");if(ed){e.preventDefault();e.stopPropagation();const i=ed.dataset.edit.indexOf(":");openEditor(ed.dataset.edit.slice(0,i),ed.dataset.edit.slice(i+1));return}
  const nw=e.target.closest("[data-new]");if(nw){e.preventDefault();openEditor(nw.dataset.new,null)}
  const rs=e.target.closest("[data-restore]");if(rs){const [k,id]=rs.dataset.restore.split(":");persist(k,id,null).then(()=>{route();toast("Reposto")})}
},true);
function editedListHTML(){
  const names={script:"Guião",obj:"Objeção",phase:"Fase",pnl:"Princípio",princ:"Princípio",dont:"Ponto",quiz:"Pergunta"};
  const rows=[];
  Object.keys(OV).forEach(k=>Object.keys(OV[k]||{}).forEach(id=>{const r=OV[k][id];const b=(BASE[k]||[]).find(x=>x.id===id);if(!b)return;const title=b.t||b.q||id;rows.push(`<li class="check" style="align-items:center"><span style="flex:1;min-width:0"><b>${esc(names[k]||k)}:</b> ${esc(title)} <span class="badge ${r.deleted?"b-warn":"b-src"}">${r.deleted?"Apagado":"Editado"}</span></span><button class="btn ghost" type="button" data-restore="${k}:${esc(id)}">Repor original</button></li>`)}));
  return rows.length?`<ul class="checks" style="padding:0">${rows.join("")}</ul>`:`<p class="muted" style="margin:0">Ainda não alterou nenhum texto original.</p>`;
}

/* Ligação ao armazenamento partilhado da ferramenta */
async function initStore(){
  let c=window.claude;
  if(!c||!c.use){await new Promise(r=>setTimeout(r,300));c=window.claude}
  if(!c||!c.use)return;
  let db=null;try{db=await c.use("db")}catch(e){db=null}
  if(!db)return;
  let user=null;try{user=await c.use("user")}catch(e){}
  try{canEditTexts=user?((await user.canEdit())??true):true}catch(e){canEditTexts=true}
  dbRef=db;syncMode="db";
  /* perfil pessoal sincronizado entre dispositivos */
  try{
    const uid=user?await user.id():null;
    if(uid){
      const pref=db.doc("data/users/"+uid+"/perfil");
      const snap=await pref.get();
      if(snap.exists){const d=snap.data()||{};if(d.me&&typeof d.me==="object"){store.me=Object.assign({},store.me,d.me);save()}}
      else if(store.me&&store.me.meuNome){try{await pref.set({me:store.me})}catch(e){}}
      window.__savePerfil=async()=>{try{await pref.set({me:store.me})}catch(e){}};
    }
  }catch(e){}
  let lastKey=null;
  const localOV=store.ov&&Object.keys(store.ov).length?clone(store.ov):null;
  db.collection("textos").onSnapshot(qs=>{
    const o={};
    qs.docs.forEach(d=>{const x=d.data()||{};if(!x.kind||!x.id)return;let data=null;try{data=x.json?JSON.parse(x.json):null}catch(e){}(o[x.kind]=o[x.kind]||{})[x.id]={data,deleted:!!x.deleted,custom:!!x.custom,ts:x.ts||0}});
    const key=JSON.stringify(o);if(key===lastKey)return;lastKey=key;
    OV=o;rebuild();if(!$("#overlay").innerHTML)route();
  },()=>{});
  /* Alterações feitas antes neste navegador passam para o armazenamento partilhado */
  if(localOV&&canEditTexts){for(const k of Object.keys(localOV))for(const id of Object.keys(localOV[k]))await persist(k,id,localOV[k][id]);store.ov={};save()}
  route();
}
rebuild();

buildNav();
window.addEventListener("hashchange",route);
route();
initStore();
})();
</script>
