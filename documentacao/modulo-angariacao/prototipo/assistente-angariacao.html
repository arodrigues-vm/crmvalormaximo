  ["n","Na parte final, não faça pausas. Só espera pela resposta depois de dar as duas opções de horário."],
  ["n","Antes de desligar, peça para enviar o seu cartão por WhatsApp (guião “Cartão virtual por WhatsApp”)."]],
 keys:["O objetivo da chamada é reunir e conhecer o imóvel, não “angariar”.","Nunca diga “gostava de angariar a sua casa”: assim, quem ganha é você.","Quem marca é sempre você, com duas opções de horário.","Sorria ao telefone e adapte-se à pessoa. Isto é um modelo, não uma cassete.","Trate por Senhor ou Senhora Dona até a pessoa pedir outra coisa.","A pergunta sobre a casa deve ter resposta “sim”; o ideal é a pessoa elogiar a casa.","Não diga “sem compromisso” à partida: só se a pessoa levantar a objeção."],
 ifno:"Compreendo perfeitamente, Sr. {proprietario}. Desejo-lhe as maiores felicidades com a venda. Depois registe o imóvel (tipologia, zona, preço), porque pode precisar dele na angariação reativa."},
{id:"naoquer",cat:"Telefone",t:"“Não quero trabalhar com imobiliárias”",when:"O proprietário recusa logo no primeiro contacto.",type:"form",src:["1.1"],
 steps:[
  ["s","Compreendo perfeitamente o que diz. Com certeza tem a ver com os honorários, compreendo."],
  ["s","Desejo-lhe muito sucesso. A casa parece-me muito interessante, por isso espero que corra tudo bem."],
  ["s","Fico ao seu dispor para qualquer dúvida que surja. O meu nome é {meuNome}, da {agencia}. Basta ligar-me, terei todo o gosto em ajudar."],
  ["n","Só se a sua agência tiver intermediação de crédito registada:"],
  ["s","Aproveito para lhe dizer que muitos proprietários nesta situação julgam que a casa já está vendida e ficam à espera da resposta do crédito do comprador. Para que isso não seja um dissabor: somos intermediários de crédito autorizados pelo Banco de Portugal e o apoio é gratuito para si."],
  ["s","Permite-me que lhe ligue daqui a 30 dias, para saber como está a correr?"]],
 keys:["Psicologia inversa: a pessoa espera uma má reação e recebe simpatia.","Diga o seu nome e o da agência três vezes ao longo da conversa (efeito de repetição).","Registe sempre o imóvel. É a base do 2.º nível da angariação reativa.","Agende já a chamada dos 30 dias."],
 warn:"Mencione a intermediação de crédito só se a sua empresa a tiver efetivamente registada."},
{id:"segunda",cat:"Telefone",t:"Segundo telefonema: tenho um comprador",when:"Tem um comprador real, com visita marcada, para um imóvel de alguém que antes recusou.",type:"form",src:["1.1","2.1"],
 steps:[
  ["s","Muito boa tarde, Sr. {proprietario}. Fala {meuNome}, da {agencia}. Peço-lhe desde já desculpa por ligar antes do combinado, porque tínhamos ficado de falar a {dia}. Mas vai compreender já o porquê do meu telefonema."],
  ["s","Ontem estive reunido com um casal com dois filhos pequenos que procura um {tipologia} perto da escola, até {preco}. Lembrei-me logo do seu imóvel, que me pareceu muito interessante no anúncio."],
  ["s","Como sabe, também tratamos do crédito, por isso falta apenas o imóvel. A razão do meu telefonema é saber se quer aproveitar esta oportunidade e fazermos a visita com este casal amanhã às {hora1}. O que lhe parece?"],
  ["n","Se aceitar, siga para o guião “Ir a casa antes da visita”."]],
 keys:["“Vai compreender já o porquê do meu telefonema” aumenta a atenção.","Conte a história do comprador (necessidade, motivo, orçamento) sem o identificar.","“Aproveitar esta oportunidade”: a escolha fica com o proprietário.","Pedir desculpa por não cumprir o prazo combinado mostra profissionalismo."],
 warn:"Use apenas com um comprador e uma visita que existam de facto. O formador insiste nisto: sem cliente agendado soa a mentira. Os 85% de sucesso que refere são a experiência dele, não uma garantia."},
{id:"docs",cat:"Telefone",t:"Ir a casa antes da visita do comprador",when:"O proprietário aceitou a visita e diz “traga o cliente e depois logo se vê”.",type:"form",src:["1.1"],
 steps:[
  ["s","Combinado, amanhã às {hora1} lá estaremos. Gostaria de lhe perguntar: quanto à documentação do imóvel, tem tudo tratado? Certidão, caderneta, certificado energético? Imagino que, se o cliente gostar mesmo da casa, amanhã aceite assinar o contrato-promessa."],
  ["s","Não se preocupe, estamos cá para facilitar. Sugiro encontrarmo-nos ainda hoje: analisamos o que falta e amanhã de manhã tratamos de o recolher, para não ser impedimento da visita. Dá-lhe mais jeito às 18h00 ou às 19h30?"],
  ["n","Se já tiver tudo:"],
  ["s","Ótimo. Mesmo assim, temos de nos reunir hoje para analisar os documentos e eu conhecer a casa. Assim preparo a apresentação de amanhã a partir do que vir hoje. 18h00 ou 19h30?"]],
 keys:["Nunca mostre um imóvel sem o conhecer, sem analisar a documentação e sem contrato escrito.","Não pergunte se a pessoa quer fazer algo que é obrigatório. Pergunte quando."],
 warn:"O contrato de mediação tem de ser escrito. Quando estiver em casa do proprietário, explique-o com transparência antes de o assinarem."},
{id:"confirma",cat:"Telefone",t:"Confirmar a visita no turno anterior",when:"Tem uma reunião marcada em casa do proprietário.",type:"form",src:["2.1"],
 steps:[
  ["s","Boa tarde, falo com o Sr. {proprietario}? Fala {meuNome}. Combinámos amanhã às {hora1} em sua casa. A razão do meu telefonema é apenas confirmar se está tudo certo."],
  ["n","Se houver um contratempo:"],
  ["s","Com certeza, não há problema nenhum. Em vez das {hora1}, fica às {hora2}? Eu ajusto a minha agenda. Fique tranquilo, não tem de se apressar."],
  ["n","Depois envie uma mensagem com o seu nome, contacto e hora confirmada."]],
 keys:["Visita sábado de manhã: ligue sexta à tarde. Visita à tarde: ligue nessa manhã.","Muitos proprietários não guardaram o seu número no primeiro contacto.","Ajustar com simpatia evita ficar à porta à espera."]},
{id:"placa",cat:"Telefone",t:"Ligaram pela placa, mas procuram outra tipologia",when:"Tem um T1 com placa e quem liga procura um T2 na zona.",type:"form",src:["2.1"],
 steps:[
  ["s","Esse imóvel é um T1. Diga-me: procura um {tipologia} nesta zona, até que valor? Neste momento não o tenho na agência, mas estou a tratar de soluções aqui na zona. Caso consiga preparar um imóvel para visitas, teria disponibilidade amanhã ou no sábado, às 11h00 ou às 15h30? O que lhe parece?"],
  ["s","Com quem estou a falar? Muito bem. Deixe-me fazer uns contactos e volto a ligar-lhe para confirmar a visita, ou para nos encontrarmos e lhe apresentar as soluções disponíveis."]],
 keys:["Não se despeça de um comprador: fique com o nome e o contacto.","Com um comprador concreto, lance uma angariação reativa (colegas, CRM, cartas na urbanização)."]},
{id:"exclientes",cat:"Telefone",t:"Clientes antigos da agência na sua zona",when:"Proprietários que compraram ou venderam com a agência e vivem na sua zona.",type:"form",src:["1.2"],
 steps:[
  ["s","Muito bom dia, Sr. {proprietario}, como vai? O meu nome é {meuNome} e ligo da {agencia}. Sei que é nosso cliente. Sou o consultor especialista aqui na zona e estou ao seu dispor: qualquer questão sobre o seu imóvel, conte comigo."],
  ["s","Como boas-vindas, tenho ao seu dispor um relatório de avaliação atualizado do seu imóvel. Amanhã tenho uma reunião aí perto às 16h30. Dá-lhe jeito por volta das 15h00, ou prefere às 17h30, no final da reunião? Terei todo o gosto em entregar-lho em mão."]],
 keys:["Inclua clientes de consultores que já saíram da agência: muitas vezes ninguém lhes dá seguimento.","Um contacto destes pode trazer a casa dele ou de um familiar."],
 warn:"Use apenas dados que a agência pode tratar para este fim (RGPD)."},
{id:"credito",cat:"Telefone",t:"Cliente antigo com prestação alta",when:"Tem intermediação de crédito e clientes com prestações que subiram.",type:"form",src:["1.2"],
 steps:[
  ["s","Olá, D. {proprietario}, como está? Ligo porque é nossa cliente há alguns anos e lembro-me do valor da prestação nessa altura. Imagino que hoje esteja bem mais alta. Queria saber se está confortável com os encargos ou se a podemos ajudar. Temos intermediação de crédito e podemos analisar uma transferência que lhe dê alguma poupança mensal."],
  ["n","Se a transferência não chegar, leve o relatório de avaliação já preparado."],
  ["s","Comprou por 200 mil euros e hoje o imóvel vale cerca de 320 mil. Tem aqui uma mais-valia que lhe dá opções. Se não se sente confortável, podemos ajudá-la a vender e a encontrar outra solução, até porque a vida também mudou nestes anos."]],
 keys:["De forma natural, nunca imposta.","Pode gerar uma angariação e uma nova compra com o mesmo cliente."]},
{id:"colega",cat:"Telefone",t:"Partilha com colega de outra marca",when:"4.º nível da angariação reativa: já tentou tudo o resto.",type:"form",src:["1.1"],
 steps:[["s","Olá, colega, como vai? O meu nome é {meuNome} e ligo da {agencia}. Vi que tem um {tipologia} no edifício {urbanizacao}. Tenho um cliente disponível para visitar amanhã às {hora1}. Seria possível fazermos a visita e partilharmos?"]],
 keys:["Antes disto: 1) mensagem “SOS” aos colegas da agência; 2) proprietários que disseram não; 3) prospeção e cartas no local.","Partilhar é bom, mas a partilha dá metade da comissão."]},
{id:"rua",cat:"Presencial",t:"Abordagem na rua",when:"Está na sua zona de prospeção (alternativa a bater às portas).",type:"form",src:["1.2","1.1"],
 steps:[
  ["n","Escolha pessoas tranquilas: à saída do café, a passear o cão. Nunca quem vai a correr."],
  ["s","Peço desculpa de incomodar. Por acaso reside aqui no bairro? Muito bem. O meu nome é {meuNome}, sou consultor imobiliário especialista nesta zona e vim cá especificamente porque procuro um {tipologia}. Conhece algum vizinho que esteja a pensar vender?"],
  ["n","Se a pessoa for simpática, deixe um cartão e peça o contacto. Volte a ligar quando procurar outra tipologia. Com o tempo, passa a ser ela a avisá-lo."]],
 keys:["Ninguém se ofende com esta pergunta.","Crie uma rede de pessoas na zona: donos de cafés, porteiros, vizinhos."],
 warn:"Diga “para um cliente com visita marcada” apenas se for verdade."},
{id:"placacolega",cat:"Presencial",t:"Imóvel com placa de outro colega",when:"Na zona, vê um imóvel com a placa de outra agência e tem um comprador.",type:"form",src:["1.1"],
 steps:[["s","Peço imensa desculpa. Ando à procura de um apartamento para um casal com visita marcada amanhã às {hora1}. Este imóvel está à venda? Muito bem. Não sei que tipo de contrato tem com o colega; seja como for, estará bem apoiado. Se for em exclusividade, gostaria muito de falar com o seu consultor. Quer dar-lhe uma palavrinha e perguntar se concorda? Por mim, é com todo o gosto."]],
 keys:["Nunca denigra o colega nem tente “passar-lhe a perna”.","Se o contrato for em aberto, pode fazer também um contrato em aberto."]},
{id:"certificado",cat:"Presencial",t:"Pedido recente de certificado energético",when:"Consultou certificados emitidos recentemente na sua zona.",type:"form",src:["1.2"],
 steps:[["s","Muito boa tarde. Fala com o proprietário? Tive conhecimento de que pediu recentemente o certificado energético do seu apartamento. Não sei se já o vendeu ou arrendou, nem qual é a finalidade, mas, como sou consultor especialista nesta urbanização, vim colocar-me ao seu dispor. Se quiser vender, posso ajudá-lo numa venda mais rápida e nas melhores condições."]],
 keys:["“Tudo, desde que seja com bons modos e boa intenção.”","Muitas vezes já têm comprador. Aceite e siga em frente."],
 warn:"Confirme com o seu responsável que este uso da informação é admissível à luz do RGPD."},
{id:"c-reativa",cat:"Cartas",t:"Carta: procuro para cliente com visita marcada",when:"Angariação reativa, 3.º nível: prospeção na urbanização certa.",type:"form",src:["1.1"],
 letter:"Caro senhor proprietário,\n\nSe equaciona a possibilidade de vender o seu imóvel, por favor contacte-me com urgência. Procuro um {tipologia} nesta urbanização, até {preco}, para um cliente com visita marcada para amanhã às {hora1}.\n\nAo seu dispor,\n{meuNome} · {telefone}\n{agencia} · Licença AMI {ami}",
 keys:["Preto e branco, com ar de escrito à pressa. Um flyer bonito parece publicidade.","Só nos prédios do segmento certo, debaixo da porta.","Nunca escreva “tenho clientes para esta zona”: soa a bluff."],
 warn:"Inclua sempre a denominação da empresa e a licença AMI: é obrigatório em qualquer comunicação. Entre num prédio apenas quando alguém o deixar entrar. A frase “visita marcada” só se for verdade."},
{id:"c-vendido",cat:"Cartas",t:"Carta: acabámos de vender na urbanização",when:"Um imóvel (seu ou de um colega) foi vendido na zona.",type:"form",src:["1.1","1.2"],
 letter:"Caro senhor proprietário,\n\nEm virtude de termos vendido o imóvel em {urbanizacao}, temos clientes interessados a quem já não o podemos apresentar. Procuramos ativamente soluções alternativas nesta urbanização.\n\nSe equaciona a possibilidade de vender a sua casa, por favor ligue-me com urgência.\n\nAo seu dispor,\n{meuNome} · {telefone}\n{agencia} · Licença AMI {ami}",
 keys:["Junte uma fotografia da placa “Vendido”.","O formador recomenda tornar isto obrigatório após cada venda. Conta o caso de uma consultora que angariou 9 imóveis assim."],
 warn:"O formador fala em “visitas agendadas que não vamos poder cumprir”. Escreva-o só se for verdade."},
{id:"c-angariado",cat:"Cartas",t:"Carta: acabei de angariar (vizinhança)",when:"Logo após angariar, na envolvente do imóvel.",type:"form",src:["1.2","2.2"],
 letter:"Caro senhor proprietário,\n\nSe gostaria de trazer para morar junto de si um familiar, um amigo ou um colega de trabalho, temos ao seu dispor um fantástico {tipologia} nesta urbanização: [três pontos fortes da análise SWOT].\n\nNão perca esta oportunidade e partilhe este código QR com quem possa ter interesse.\n\nAo seu dispor,\n{meuNome} · {telefone}\n{agencia} · Licença AMI {ami}",
 keys:["Muitas vezes quem liga é o próprio vizinho, que quer trocar de casa.","Gera contactos de compradores e de vendedores."]},
{id:"c-tipologia",cat:"Cartas",t:"Carta: procuram uma tipologia que não tenho",when:"A sua placa atrai pedidos de outra tipologia.",type:"form",src:["2.1"],
 letter:"Caro senhor proprietário,\n\nSe equaciona a possibilidade de vender o seu imóvel e se este é de tipologia {tipologia}, agradecia que me contactasse com alguma urgência. Em virtude de termos um imóvel publicitado nesta urbanização ({urbanizacao}), temos clientes que manifestam interesse por esta tipologia. Caso seja essa a sua intenção, contacte-me para agendarmos visitas.\n\nAo seu dispor,\n{meuNome} · {telefone}\n{agencia} · Licença AMI {ami}",
 keys:["Indique onde está o seu imóvel (bloco, número) para dar um caráter de verdade."]},
{id:"video",cat:"Redes sociais",t:"Vídeo curto ao angariar (15 a 20 s)",when:"Acabou de assinar o contrato. Grave já, com a urbanização atrás.",type:"form",src:["1.2","4"],
 steps:[["s","Olá a todos! Estou muito satisfeito: acabei de angariar um imóvel aqui em {zona}. Tem áreas fabulosas, sobretudo nas zonas sociais, e vistas desafogadas. Fique atento: dentro de quatro ou cinco dias estará disponível para visitas. Até já!"]],
 keys:["Não diga o bloco nem a porta.","Gera chamadas antes de o anúncio sair."]},
{id:"zona-rs",cat:"Redes sociais",t:"Publicação: “hoje estou na zona”",when:"Dias de prospeção no terreno.",type:"form",src:["1.2"],
 steps:[["s","Hoje estou na zona de {zona}. Se é um dos meus seguidores e gostaria de conhecer o valor do seu imóvel, ou tirar alguma dúvida, contacte-me hoje mesmo. Terei todo o gosto em falar consigo pessoalmente."]],
 keys:["Todos os seus contactos devem saber o que faz.","Mostre que está sempre em movimento no mercado."]},
{id:"f8",cat:"Fidelização",t:"Pós-escritura: chamada dos 8 dias",when:"Oito dias depois da escritura.",type:"form",src:["1.1","2.1"],
 steps:[["s","Olá, {proprietario}, é o {meuNome}. Como correu a mudança? Correu tudo como esperavam? Chegaram a usar alguma das empresas da lista que vos deixei? Pergunto porque, se alguma falhou, quero retirá-la da lista."]],
 keys:["No dia da escritura entregue uma folha de contactos úteis: condomínio, mudanças, eletricidade, gás, água, telecomunicações, canalizador, carpinteiro, pintor.","Avise que não conhece todos e peça que lhe digam se algum correr mal.","Uma participante sugere pedir aqui um testemunho escrito."]},
{id:"f30",cat:"Fidelização",t:"Pós-escritura: 30 dias e um presente",when:"Um mês depois da escritura.",type:"form",src:["1.1"],
 steps:[["s","Olá, {proprietario}! Está tudo bem convosco? A casa nova está a corresponder ao que esperavam? Sabem que faz hoje um mês que compraram a casa? Gostava muito de vos dar um abraço. Estão em casa hoje? Posso passar aí?"],["n","Leve um presente."]],
 keys:["No dia da escritura um presente não surpreende. Um mês depois, já ninguém o espera e supera a expectativa."]},
{id:"fano",cat:"Fidelização",t:"Datas importantes e relatório anual",when:"Ao longo dos anos seguintes.",type:"form",src:["1.1","2.1"],
 steps:[
  ["n","Agende na escritura: “Escritura Sr. X (ano)”, a repetir todos os anos. Junte aniversários, início do ano letivo dos filhos e Natal. Telefone; nunca envie mensagens automáticas da empresa."],
  ["s","Olá, {proprietario}, como estão? E a família? Ligo porque é nosso cliente há alguns anos e temos algo para lhe oferecer: um relatório de avaliação atualizado da sua casa. Quando lhe daria jeito passar pelo escritório?"]],
 keys:["Três a cinco contactos por ano, sem interesse.","Fidelize apenas os clientes de quem gostou.","Nunca diga “não se esqueça de mim”.","Responda sempre a dúvidas, mesmo quando não ganha nada com isso."]},
{id:"alternativas",cat:"Compradores",t:"O comprador pede algo que não existe",when:"Os critérios do comprador não existem no mercado.",type:"form",src:["1.1"],
 steps:[
  ["s","Compreendo perfeitamente: a zona é importante por causa da escola dos miúdos, e os {preco} são o valor confortável para manterem a vossa qualidade de vida."],
  ["s","Infelizmente, os T3 no centro começam nos 375 mil euros e neste momento não há nenhum abaixo desse valor, em nenhuma agência."],
  ["s","Por isso, gostava de vos perguntar o que será mais confortável: um T2 até {preco} aqui no centro, enquanto os miúdos são pequenos, ou um T3 mais definitivo numa zona a dez minutos de carro, com um quarto para cada um? O que vos parece mais confortável?"]],
 keys:["Nunca diga “tem de ir para outra zona” ou “só consegue um T2”: o comprador sente que não foi ouvido.","Valide tudo antes de dar as alternativas.","Termine com “O que lhe parece?”."]},
{id:"ainda",cat:"Compradores",t:"Existe no mercado, mas ainda não o tenho",when:"O pedido é realista, mas não tem esse imóvel na carteira.",type:"form",src:["1.1","2.1"],
 steps:[
  ["s","Compreendi perfeitamente o que procura: um {tipologia} até {preco} em {zona}. Hoje não estou em condições de lhe mostrar, mas sugiro reunirmo-nos amanhã aqui no escritório para analisarmos as possibilidades disponíveis. Vemos imagens no computador e seguimos logo para a visita do que lhe interessar. Dá-lhe mais jeito às {hora1} ou às {hora2}? O que lhe parece?"],
  ["n","Depois, por esta ordem: 1) mensagem “SOS” no grupo dos colegas da agência; 2) ligar aos proprietários que disseram não; 3) prospeção e cartas na urbanização; 4) partilha com outras marcas."],
  ["n","Se no fim não houver nada: mostre-lhe na internet que não existe no mercado (não apenas na sua agência) e volte às perguntas alternativas."]],
 keys:["A palavra-chave é “ainda”.","Nunca diga “deixe o contacto que eu ligo quando surgir”: o comprador vai logo a outra agência.","Não prometa visitas a imóveis que não tem. Marque uma reunião."]},
{id:"whats",cat:"Mensagens",t:"Cartão virtual por WhatsApp",when:"Logo a seguir a qualquer telefonema, mesmo que a pessoa tenha recusado.",type:"form",src:["P1.1","2.1"],
 steps:[
  ["n","Peça autorização antes de desligar: “Posso enviar-lhe já por WhatsApp o meu cartão, para ficar com o contacto?”"],
  ["s","Sr. {proprietario}, agradeço a simpatia com que me atendeu. Aqui fica o meu cartão virtual, para guardar e falar comigo sempre que entender. Fico ao seu dispor.\n{meuNome} · {telefone}\n{agencia} · Licença AMI {ami}"],
  ["n","Depois de uma reunião marcada, envie também a confirmação:"],
  ["s","Sr. {proprietario}, confirmo a nossa reunião amanhã às {hora1}. Qualquer imprevisto, ligue-me para o {telefone}. Até amanhã! {meuNome}"]],
 keys:["Quando voltar a ligar, o seu nome já aparece no telemóvel da pessoa.","A licença AMI é obrigatória em qualquer comunicação."]},
{id:"decisores",cat:"Telefone",t:"Garantir que estão todos os que decidem",when:"Ao marcar a reunião, quando ainda não sabe se a casa é de mais alguém.",type:"form",src:["P2.1"],
 steps:[
  ["s","Peço desculpa, nem lhe perguntei: a casa é só da senhora ou de mais alguém? Muito bem. Seria interessante estarmos os três. Qual é o horário mais conveniente para os dois: às {hora1} ou às {hora2}?"],
  ["n","Se um dos proprietários estiver longe, proponha que se junte por videochamada. Se quem decide for um filho (por exemplo, com pais idosos), convide-o também, mesmo que não assine."]],
 keys:["Quem não ouviu a apresentação não vai sentir o mesmo quando lha contarem.","Sem todos os que assinam, o contrato fica para depois, e depois muitos desistem."]},
{id:"comprador-primeiro",cat:"Telefone",t:"Confirmar com o comprador antes de ligar ao proprietário",when:"Um proprietário recusou, mas tem no CRM um comprador compatível.",type:"form",src:["P1.2"],
 steps:[
  ["s","Olá, está tudo bem? Ligo-lhe com uma possibilidade. Não lhe posso garantir nada ainda, mas é possível que consiga um {tipologia} até {preco} em {zona}. Se tratarmos da documentação, teria disponibilidade para visitar no sábado, às 11h00, ou ao fim da tarde, às 15h30?"],
  ["n","Com a visita do comprador confirmada, faça o “Segundo telefonema” ao proprietário."]],
 keys:["Com um comprador real e agendado, o segundo telefonema tem verdade.","Diga ao comprador exatamente o que sabe e o que ainda não sabe."]},
{id:"guia-vende-sozinho",cat:"Telefone",t:"Oferecer um guia a quem vende sozinho",when:"Proprietário que quer mesmo vender sem imobiliária. Só se tiver o guia feito.",type:"adapt",src:["P1.2","P2.1"],
 steps:[
  ["s","Sr. {proprietario}, compreendo perfeitamente que queira vender sozinho. Preparámos um guia para quem vende sem imobiliária: documentação necessária, cuidados a ter ao receber desconhecidos em casa, como definir o preço. Posso enviar-lho sem custo? Gostava apenas de saber depois se lhe foi útil e o que acrescentaria."],
  ["n","Daqui a dois dias:"],
  ["s","Teve oportunidade de ver o guia? O que lhe pareceu útil? Sentiu falta de alguma informação? O que mais conta para vender bem é o preço: como chegou ao seu valor? Se quiser, posso preparar-lhe uma análise do que está à venda na sua zona."]],
 keys:["É um pretexto honesto para voltar a falar e mostrar que sabe do assunto.","Aproveite as respostas para melhorar o guia."],
 warn:"O formador apresenta o guia como “em fase de validação” e “à venda a partir de junho”. Diga apenas o que for verdade."},
{id:"honorarios",cat:"Presencial",t:"Apresentar os honorários",when:"No fecho, enquanto preenchem o acordo juntos.",type:"form",src:["P3.1","P1.2"],
 steps:[
  ["s","Chegamos aos honorários, uma parte importante para si e para nós. Praticamos 5% mais IVA sobre o valor pelo qual o imóvel vier a ser vendido: se baixar o preço, é sobre o valor da venda. São pagos no contrato-promessa se o sinal for superior a 10%; se for inferior, só na escritura. Incluem o tratamento de toda a documentação, sua e do comprador, e o acompanhamento até à escritura. Propomos um acordo de seis meses, o normal para este tipo de imóvel. O tempo médio de venda dos imóveis que trabalhamos assim tem sido de [o seu número real] dias."],
  ["n","Continue a preencher. Não faça pausa nem pergunte “parece-lhe bem?”."]],
 keys:["Apresente com segurança, a olhar nos olhos e a sorrir.","Uma pausa depois do valor convida a pessoa a discordar.","Não justifique com os seus custos, nem deixe a comissão “para falarmos no fim”."],
 warn:"Adapte a percentagem, o momento do pagamento e o prazo às condições reais do seu contrato."},
{id:"preco-telefone",cat:"Telefone",t:"Proprietário que quer o preço “limpo”",when:"Ao telefone, pede que a comissão fique por cima do preço que quer.",type:"form",src:["P3.2"],
 steps:[["s","Compreendo: quer {preco} limpos e que os honorários fiquem por cima. Sem conhecer o imóvel não me é fácil comentar. Proponho encontrarmo-nos em sua casa: conheço o imóvel e ofereço-lhe um relatório de avaliação; basta ter a caderneta predial, que se tira online. Depois falamos: se o valor de mercado o permitir, com todo o gosto, e se sobrar mais, melhor para si. Se não for possível, digo-lhe logo as possibilidades e o senhor decide. Às {hora1} ou às {hora2}?"]],
 keys:["Não prometa nem recuse ao telefone.","Leve duas análises da concorrência: a do segmento certo e a do segmento onde ele quer pôr a casa."]},
{id:"r-investidor",cat:"Consultar com cuidado",t:"“Represento um investidor estrangeiro”",when:"Sugerido pelo formador para quem escreve no anúncio que não quer imobiliárias.",type:"risk",src:["P1.2","P2.1"],
 steps:[
  ["n","O que o formador sugere: deixar a pessoa desabafar, dizer que não está a ligar para angariar e apresentar-se como representante de um comprador."],
  ["s","Com certeza, li o anúncio, e de modo algum estou a ligar para angariar a sua casa. Represento um cliente que está fora do país e já fez vários investimentos connosco; pediu-me soluções para um novo investimento e o seu imóvel pareceu-me interessante. A lei não permite dupla remuneração: quem me paga é ele, o senhor não paga nada. Dava-lhe mais jeito às {hora1} ou às {hora2}?"],
  ["n","Depois, o formador mantém a pessoa à espera de uma “decisão do cliente” durante dias e, por fim, diz que o cliente escolheu outro imóvel, oferecendo então os seus serviços ao proprietário."]],
 warn:"Se o cliente não existir, é uma declaração falsa a um consumidor: pode constituir prática comercial enganosa, pôr em causa a sua licença e destruir a confiança quando for descoberto. O próprio formador chama-lhe “uma pequena mentira”. Só é válido com um mandato real de comprador (contrato de mediação com o comprador).",
 alt:"a resposta da objeção “O anúncio diz que não quer ser contactado por imobiliárias” (oferecer ajuda real com o crédito) ou a mensagem sobre um imóvel exclusivo na mesma zona."},
{id:"r-guia-validacao",cat:"Consultar com cuidado",t:"Guia “em validação” e oferta com prazo",when:"Sugerido pelo formador para quem vende sozinho.",type:"risk",src:["P1.2"],
 steps:[
  ["s","Desenvolvemos um dossiê para proprietários que vendem sem imobiliária, que vai ser comercializado a partir de junho. Nesta fase estamos a validá-lo e oferecemo-lo em troca do seu feedback."],
  ["s","Estamos a oferecer relatórios de avaliação gratuitos até 31 de março. Amanhã tenho uma reunião às 16h00 aí na sua urbanização; dá-lhe jeito às 15h00 ou às 17h30?"]],
 warn:"Prazos, fases de validação e reuniões “aí perto” inventados criam uma urgência falsa. Se forem verdade, pode usá-los; se não, não.",
 alt:"o guião “Oferecer um guia a quem vende sozinho”."},
{id:"r-ja-vendido",cat:"Consultar com cuidado",t:"Carta “o imóvel já está vendido” para rescindir",when:"Sugerido pelo formador quando o proprietário tem contratos em aberto e quer dar-lhe exclusividade.",type:"risk",src:["3.1"],
 steps:[
  ["s","Venho por este meio pedir a rescisão do contrato de mediação n.º [n.º], em virtude de já ter prometido vender o imóvel, pelo que agradeço que o retirem de imediato de publicidade."],
  ["n","O formador sugere ainda dizer, se as agências ligarem, que a venda anterior falhou por causa do crédito."]],
 warn:"É uma declaração falsa assinada pelo proprietário. As agências podem pedir prova ou reclamar comissão, e o proprietário fica exposto. Lembre-se de que um exclusivo sobre contratos ainda em vigor não produz efeito.",
 alt:"o proprietário denuncia os contratos nos termos e prazos que eles preveem, dizendo apenas que decidiu deixar de trabalhar com essa agência. Até lá, faça um contrato em aberto ou espere."},
{id:"r-pos-datar",cat:"Consultar com cuidado",t:"Pós-datar o contrato de exclusividade",when:"Sugerido pelo formador em conjunto com a carta anterior.",type:"risk",src:["3.1"],
 steps:[["n","O que o formador sugere: assinar hoje o contrato de exclusividade com uma data alguns dias à frente, para ficar posterior às rescisões."]],
 warn:"Um contrato com data falsa pode ser visto como má-fé num litígio e pôr em causa a comissão.",
 alt:"assinar o exclusivo apenas depois de as rescisões produzirem efeito, com a data verdadeira."},
{id:"r-minuta-nula",cat:"Consultar com cuidado",t:"Assinar uma minuta não validada e substituí-la depois",when:"Sugerido pelo formador enquanto a minuta da agência não está validada pelo IMPIC.",type:"risk",src:["3.1"],
 steps:[["s","Temos aqui o contrato que assinámos na semana passada, mas estava escrito à mão. É rigorosamente igual, apenas passámos tudo a computador. Confirme comigo e assine este, por favor."],["n","O formador sugere pôr no novo contrato a data do primeiro."]],
 warn:"Pedir ao proprietário que assine um documento com data anterior, escondendo o motivo, é enganoso.",
 alt:"usar desde o início um contrato em texto corrido, sem escolhas múltiplas, que não depende da validação da minuta."},
{id:"r-rescisao-diferida",cat:"Consultar com cuidado",t:"Rescisão que só produz efeito meses depois",when:"Contado pelo formador para um proprietário que diz já não querer vender.",type:"risk",src:["P2.2"],
 steps:[["s","Não se preocupe, retiramos já a publicidade e ninguém mostra mais a sua casa. (O termo de rescisão assinado só produz efeito no fim dos seis meses.)"]],
 warn:"O proprietário assina julgando que fica livre. Se vier a vender diretamente, a cobrança da comissão pode ser contestada e a sua reputação sofre.",
 alt:"se suspeitar de uma venda direta, fale abertamente da cláusula de comissão do contrato e do que acontece se vender a quem conheceu através do seu trabalho."},
{id:"r-historia-pessoal",cat:"Consultar com cuidado",t:"História pessoal para defender a comissão",when:"Usado pelo formador como último recurso quando o proprietário não aceita os honorários.",type:"risk",src:["P3.1"],
 steps:[["s","A minha filha está a estudar e prometi-lhe um computador se passasse a todas as cadeiras. Trabalho todos os dias para cumprir essa promessa. O que lhe devo dizer em junho? Que não lhe posso dar o computador porque o ofereci no desconto da comissão?"]],
 warn:"Se a história não for sua, é manipulação. Mesmo verdadeira, pode soar a pressão emocional.",
 alt:"a sequência de perguntas da objeção “Não pago 5% de comissão”."},
{id:"r-apresentar-fim",cat:"Consultar com cuidado",t:"Só dizer que é de uma imobiliária no fim da chamada",when:"Variante relatada por uma rede que diz marcar mais visitas assim. O formador rejeita-a.",type:"risk",src:["2.1","P1.1"],
 steps:[["s","Boa tarde, vi o seu anúncio. Era possível ver a casa hoje, às {hora1} ou às {hora2}? (…) Ah, já agora, o meu nome é {meuNome}, da {agencia}."]],
 warn:"A pessoa sente-se enganada logo no início e a relação começa mal. Nunca chegue a casa de alguém sem ter dito que é de uma imobiliária: também por segurança.",
 alt:"o guião “Primeiro contacto com proprietário particular”."},
{id:"r-foto-placa",cat:"Consultar com cuidado",t:"“Um amigo mandou-me uma foto da vossa placa”",when:"Pretexto partilhado por um participante.",type:"risk",src:["P4"],
 steps:[["s","Boa tarde, peço desculpa por ligar, mas um amigo mandou-me uma fotografia da vossa placa. Isto fica perto da churrasqueira?"]],
 warn:"É um pretexto falso, ainda que pequeno. Se a pessoa perceber, perde credibilidade.",
 alt:"“Passei na zona e vi a sua placa. Isto fica perto da churrasqueira?”"}
];

/* ---------- Objeções ---------- */
let OBJ=[
{id:"o1",ctx:"Telefone",q:"Não quero trabalhar com imobiliárias.",type:"form",src:["1.1","P1.1","P1.2"],
 a:"Compreendo. Calculo que o motivo sejam os honorários; com certeza pretende poupar esse valor, compreendo perfeitamente. Desejo-lhe o maior sucesso: pelo que vi, a casa é muito interessante e acredito que a venda corra bem.",
 steps:[
  "Coloco-me ao seu dispor: qualquer dúvida com documentação, em qualquer fase, uma vez que está a fazer a venda sozinho, pode ligar-me. Terei todo o gosto em ajudar, sem qualquer custo. O meu nome é {meuNome}, da {agencia}.",
  "(Só se a sua empresa tiver intermediação de crédito ou um parceiro.) Muitos proprietários que vendem sozinhos dizem-me que já têm comprador, mas esperam há um ou dois meses pela resposta do banco. Se for o seu caso, o nosso especialista de crédito trata de tudo. Não paga nada, nem o comprador: quem nos remunera é o banco.",
  "Não o empato mais, foi muito simpático. Permite-me que lhe ligue daqui a 30 dias, para saber como está a correr?",
  "Posso enviar-lhe já por WhatsApp o meu cartão, para ficar com o contacto?"],
 why:"Nunca contra-argumente. “Compreendo” põe-no do lado da pessoa sem dizer que concorda. Ela espera uma reação negativa e recebe simpatia e ajuda concreta. Dizer quem paga o crédito (o banco) dá credibilidade, porque “tudo grátis” parece falso.",
 next:"Esta objeção ultrapassa-se em duas etapas. Quando tiver um comprador real compatível, ligue antes dos 30 dias (guião “Segundo telefonema”). Registe já a tipologia, a zona, o preço e a data de seguimento.",
 extra:"Se quiser perceber o motivo, use uma pergunta neutra: “Há algum motivo em especial que o leve a decidir assim?” Não pergunte “já teve uma má experiência?”: ao telefone ainda é um desconhecido.",
 warn:"A ajuda gratuita tem de ser real. Se a pessoa ligar com uma dúvida, ajude mesmo.",script:"naoquer"},
{id:"o2",ctx:"Telefone",q:"Exclusividade não dou a ninguém, não perca tempo.",type:"form",src:["P1.2","P2.1","P4"],
 a:"Compreendo o que refere, Sr. {proprietario}. Não há qualquer problema: é possível fazer o acordo com ou sem exclusividade, consoante os casos. Posso até adiantar que só oferecemos a exclusividade cumprindo alguns critérios. O importante é que faça como achar melhor para si; fique tranquilo. Dava-lhe então mais jeito às {hora1} ou às {hora2}?",
 why:"Ao telefone não se discute a exclusividade: perde-se com facilidade. O objetivo da chamada é a reunião, e a pessoa só pode querer o que conhece.",
 next:"Trate o assunto pessoalmente, depois de apresentar o serviço.",
 warn:"Diga que trabalha das duas formas só se a sua agência o permitir. Não diga “depois falamos disso quando aí for”: soa a que vai impor."},
{id:"o3",ctx:"Telefone",q:"O anúncio diz que não quer ser contactado por imobiliárias.",type:"adapt",src:["P1.2","P2.1"],
 a:"(Deixe a pessoa desabafar sem a interromper.) Com certeza, li, e de modo algum estou a ligar para angariar a sua casa; compreendo e respeito. Ligava apenas para o ajudar: muitos proprietários que vendem sozinhos têm interessados com dificuldade no crédito. Se tiver um comprador que dependa do banco, conte comigo, sem custo para si nem para o comprador. Desejo-lhe o maior sucesso.",
 why:"Diga logo que não está a ligar para angariar: isso acalma a pessoa. Nunca diga “o senhor não ouviu o que tenho para dizer”. Assim fica num grupo diferente de todos os consultores que já lhe ligaram.",
 next:"Peça para voltar a ligar daqui a uns dias, para saber como corre a venda.",
 extra:"Alternativa honesta, usada por uma participante: enviar uma mensagem a dizer que leu o anúncio, que tem um imóvel em exclusivo na mesma zona e que gostaria de poder mostrar o dele a clientes a quem esse não agrade, com o vídeo. Ligar uns dias depois.",
 warn:"O formador sugere também dizer que representa um investidor estrangeiro. Use isso apenas se tiver mesmo um mandato de comprador. Inventar um cliente é enganar."},
{id:"o4",ctx:"Telefone",q:"Já entreguei a um amigo que é consultor.",type:"form",src:["P2.1","4"],
 a:"Compreendo, e ao dizer-me isso nem eu me sentiria confortável em lhe pedir outra coisa; está muito bem apoiado. Não perdemos nada em conversar: gostava de partilhar consigo o que eu faria para vender esta casa. Até pode encontrar ideias para passar ao seu amigo. Dava-lhe mais jeito às {hora1} ou às {hora2}?",
 steps:[
  "(Na reunião, depois de apresentar o serviço.) O seu amigo inclui no serviço o que lhe mostrei? Com toda a transparência: se isto estivesse a ser feito, a casa já estaria vendida?",
  "Se outra agência ou um vizinho comprar, quanto ganha o seu amigo?",
  "Para não melindrar o seu amigo: fazemos o nosso acordo e deixo por escrito que ele pode trazer os clientes que quiser. Eu preparo o imóvel antes de cada visita; se ele vender, ganha os honorários da venda e eu os do trabalho de preparação. E continuo a defendê-lo nas propostas. Vamos fazer o nosso acordo?"],
 why:"O proprietário quer vender. Não tem de “tirar” a casa ao amigo: ganha um serviço que o amigo não lhe dá. O formador conta casos em que esta partilha resolveu a questão sem custo extra para o proprietário.",
 next:"Vá sempre à reunião: no pior dos casos, ficou a conhecer mais uma pessoa.",
 warn:"Partilhe com o amigo apenas nos termos que a sua agência permite."},
{id:"o5",ctx:"Telefone",q:"Quero X limpo; ponham a vossa comissão por cima.",type:"form",src:["P3.2","P1.1"],
 a:"Compreendo: quer {preco} limpos e que os honorários fiquem por cima. Sem conhecer o imóvel não me é fácil comentar. Proponho encontrarmo-nos em sua casa: conheço o imóvel e ofereço-lhe um relatório de avaliação; basta ter a caderneta predial, que se tira online. Depois falamos: se o valor de mercado o permitir, com todo o gosto, e se sobrar mais, melhor para si, porque nós só cobramos os honorários. Se não for possível, digo-lhe logo as possibilidades e o senhor decide. Às {hora1} ou às {hora2}?",
 why:"Não prometa nem recuse ao telefone. Não “chova no molhado”: feche logo com o horário.",
 next:"Vá à reunião com duas análises da concorrência: a do segmento certo e a do segmento onde ele quer pôr a casa.",
 warn:"Ofereça o relatório apenas se o fizer de facto."},
{id:"o6",ctx:"Telefone",q:"Estou no estrangeiro / só aceito contacto por email.",type:"form",src:["P1.2"],
 a:"Para não atrasar o seu processo, proponho uma videochamada: envio-lhe já um link, ficamos a conhecer-nos e partilho no ecrã a informação. Tem dez minutos agora?",
 steps:["(Só por email.) Sou consultor especialista neste mercado. Posso enviar-lhe sem custo informação útil para decidir: o valor médio por metro quadrado na zona, o tempo médio de venda por tipologia e a documentação necessária. Basta pedir-ma.","(Depois.) Teve oportunidade de ver o documento? Qual é a forma mais cómoda de conversarmos: telefone, WhatsApp ou videochamada?"],
 why:"Faça o que os outros não estão dispostos a fazer.",
 warn:"O contrato tem de ser assinado pelo proprietário ou por um procurador com poderes expressos para o contrato de mediação."},
{id:"o7",ctx:"Reunião",q:"Não quero exclusividade.",type:"form",src:["P1.1","P2.2","P3.1"],
 a:"Compreendo o que refere. Gostaria de o compreender um pouco melhor: o que é que o preocupa em concreto no regime de exclusividade?",
 why:"“Não quero exclusivo” é o que a pessoa diz; por trás há quase sempre uma de três causas. Não se ultrapassa uma objeção que não se conhece. Argumentar (“vai arrepender-se”) é tentar ganhar uma batalha; as perguntas deixam a pessoa concluir sozinha.",
 causes:[
  {t:"Quer rapidez: pôr em várias agências",steps:[
   "Compreendo; no seu lugar, talvez também pensasse que mais agências dão mais oportunidades. Neste modelo qualquer agência pode vender a sua casa: partilhamos com todas e o senhor não paga mais por isso.",
   "Em sua opinião, quando entrega a cinco ou seis agências, o que vai fazer cada uma para vender?",
   "Então vai encontrar a sua casa cinco ou seis vezes no mesmo portal, com fotos, textos, áreas e preços diferentes. Se fosse comprador, o que pensaria?",
   "E se visse quatro ou cinco placas na varanda, acharia o proprietário tranquilo ou com pressa? Seria provável fazer uma proposta mais baixa? É isso que quer que aconteça consigo?",
   "Prefere ver a sua casa muitas vezes, com fotos simples, lá para a quinta página, ou uma vez só, em destaque, com fotos profissionais e home staging? O que vende mais depressa?",
   "Se fosse consultor: a uma casa entregue só a si ou a outra entregue a dez agências, a qual dedicaria mais tempo? Vamos fazer o nosso acordo?"]},
  {t:"Quer poder vender ele próprio",steps:[
   "Acha que seria justo o senhor arranjar o comprador e eu receber a comissão completa sem ter feito essa venda?",
   "E acha igualmente justo que, depois da análise da concorrência, da SWOT, do relatório e do home staging, o senhor venda graças a tudo isso e nós não ganhemos nada?",
   "Tenho uma proposta de que vai gostar: fazemos o acordo como está e escrevemos que, se for o senhor a trazer o comprador, paga apenas 50% dos honorários, e continua com o apoio jurídico, fiscal, o crédito ao seu comprador e o acompanhamento até à escritura. Se partilhamos com outras agências, porque não com o dono? Vamos fazer o nosso acordo?"],
   note:"Não ofereça os 50% logo de início: as perguntas é que fazem o trabalho. Use esta cláusula (um aditamento ao contrato) apenas se a sua agência a aceitar. O formador diz que na prática raramente chega a ser usada."},
  {t:"Já teve uma má experiência",steps:[
   "Lamento muito o que me contou; não é a primeira vez que ouço histórias assim. Não vou comentar, não me ficaria bem falar de colegas.",
   "Sei que não confia, mas pergunto-lhe: imagine que fazia o acordo comigo e eu cumpria rigorosamente tudo isto. Ficava satisfeito?",
   "Então proponho algo de que acho que vai gostar: anexamos este plano de serviço ao nosso acordo e eu assino que, se não o cumprir, pode terminar o contrato de imediato. Sente-se mais confortável assim? Vamos fazer o nosso acordo?"],
   note:"Se eu dou a minha palavra, o que me custa assiná-la?"}],
 next:"Se mesmo assim só quiser sem compromisso e não trabalhar dessa forma, saia com elegância: “Compreendo, e tive todo o gosto em conhecê-lo. Prefiro não o iludir com um serviço em que não faria tudo isto. Fico sempre ao dispor.”",
 warn:"A cláusula dos 50% e o compromisso assinado têm de respeitar a política da sua agência e ficar bem redigidos."},
{id:"o8",ctx:"Reunião",q:"Seis meses é muito tempo.",type:"form",src:["P2.2"],
 a:"Compreendo a preocupação com o tempo. Diga-me: em sua opinião, se puser a casa em várias agências sem exclusividade, quanto tempo acha que demora a vender?",
 steps:["No nosso serviço, o tempo médio até à venda tem sido de [o seu número real] dias, e o plano de marketing é de oito semanas.","Se eu cumprir tudo o que está neste plano, a que agência entregaria a casa para fazer mais?","O que eu faço fica feito: o relatório, o home staging, as fotografias. Não me sentiria confortável em fazer tudo isto e, ao fim de dois meses, ver o trabalho passar para quem não o faz."],
 why:"Muitas vezes a questão não é o tempo, é não querer compromisso. Se houver um motivo real (por exemplo, muda de cidade daqui a dois meses), aceite um prazo mais curto.",
 extra:"Com contratos muito curtos, um interessado que o proprietário conheça pode simplesmente esperar que o contrato acabe para comprar diretamente.",
 warn:"Use apenas tempos médios que tenha registado de facto."},
{id:"o9",ctx:"Reunião",q:"Não pago 5% de comissão.",type:"form",src:["P3.1","P1.2","4"],
 a:"(Escute em silêncio, olhe nos olhos, não interrompa até a pessoa parar.) Compreendo, Sr. {proprietario}. Gostava de o compreender um pouco melhor: em função do serviço que lhe apresentei, qual seria em seu entender o valor justo?",
 steps:[
  "Como chegou a esse valor? Porquê 3% e não 2% ou 4%?",
  "Os colegas que cobram 3% trouxeram-lhe uma análise da concorrência? E uma análise SWOT? Um relatório de avaliação? Home staging? (Uma pergunta de cada vez.)",
  "Se fosse meu colega e prestasse este serviço, sentia-se confortável em cobrar 3%, como quem não faz nada disto?",
  "Se um colega de outra agência tiver um comprador e aqui ganhar menos do que nos outros imóveis, seria provável levar o cliente para outra casa? Compreende porque não posso: quem ficava prejudicado era o senhor.",
  "Seja totalmente sincero: se hoje lhe trouxessem uma proposta 2% abaixo do que pede, vendia? (…) Há alguma coisa em mim que lhe desagrade? (…) Em segundos, baixou esse valor a um comprador que nem existe. Peço-lhe que mo pague a mim, para o defender. Se defendo assim os meus honorários, imagine como defendo o preço da sua casa. Vamos fazer o nosso acordo?",
  "Se eu retirasse tudo isto e fizesse só fotografias, anúncio e placa por 3%, assinava agora? Consegue tirar fotos com o telemóvel e pôr um anúncio? Então paga 3% por algo que sabe fazer, e acha caros mais 2% por todo este serviço?"],
 why:"Em abstrato, o proprietário acha que os outros “fazem o mesmo”. Ao detalhar com perguntas, é ele que vê a diferença. As pessoas concordam quando sentem que os prejudicados seriam elas.",
 next:"Se mesmo assim quiser o serviço básico: “Agradeço a sua honestidade. O serviço que procura não é este; posso indicar-lhe colegas que o fazem.”",
 warn:"Não justifique a comissão com os seus custos (fotógrafo, destaques, “metade é da agência”): se vender depressa, vão pedir desconto. A história pessoal que o formador usa (o computador da filha) só faz sentido se for verdadeira para si."},
{id:"o10",ctx:"Reunião",q:"Vendeu tão depressa que merece desconto.",type:"form",src:["P3.1"],
 a:"Fico contente que tenha sido rápido, era o que queria. Diga-me: se tivesse demorado dez ou doze meses, estaria disposto a pagar mais? Então porquê pagar menos por ter sido rápido?",
 why:"Por isso nunca se deixa a comissão “para falarmos no fim”: a pessoa lembra-se e pede desconto."},
{id:"o11",ctx:"Reunião",q:"A minha casa vale mais do que isso.",type:"form",src:["P3.2","2.1","2.2","4"],
 a:"Compreendo. Como chegou a esse valor? Vamos ver juntos o que um comprador encontra hoje: estes são os imóveis à venda aqui à volta.",
 steps:[
  "Pelo valor por metro quadrado destes imóveis, aplicado à sua área, falamos de cerca de [valor]. Vamos fazer o relatório, mas, mesmo valorizando, dificilmente passaria o limite deste segmento.",
  "Ao pô-la no valor que pretende, vai competir com estes (análise do segmento acima). Se fosse comprador, comprava este T3 com garagem pelo mesmo valor ou pagava isso pelo seu? (Repita com vários.)",
  "Imagine que um comprador vinha ver a casa e me perguntava se o estou a tentar enganar. O que lhe devo responder?",
  "Seja transparente: depois de ver o que está à venda, pagava esse valor pela sua casa?",
  "Os honorários dependem do preço: quanto mais alto, mais ganho. Mas não me sinto bem em influenciá-lo a pôr um valor que o vai prejudicar. Podemos pôr um pouco acima, dentro do segmento, para ter margem."],
 why:"Nos primeiros 30 dias aparecem quase todos os interessados. Uma casa acima do segmento não é vista por quem a compraria; depois baixa aos poucos e fica “queimada”.",
 next:"Use o “alvo de preço” e o cálculo do tempo até ao valor pedido, no separador Método.",
 warn:"Distinga preços pedidos de preços de venda. Use dados reais da sua zona; uma análise da concorrência não é uma avaliação certificada."},
{id:"o12",ctx:"Reunião",q:"Comprei caro / tenho um crédito alto.",type:"form",src:["P3.2"],
 a:"Compreendo. Mas deixe-me perguntar: se tivesse comprado 50% abaixo do valor, hoje vendia 50% abaixo? E se a casa lhe tivesse sido oferecida, oferecia-a agora?",
 steps:["O negócio que fez na altura foi o seu; quem compra hoje faz o dele.","Se fosse comprar e o vendedor lhe dissesse “vendo caro porque comprei caro”, o que lhe responderia?"],
 why:"A pessoa vê por si que o preço depende do mercado e não da sua história."},
{id:"o13",ctx:"Reunião",q:"Fiz obras de muitos milhares de euros.",type:"form",src:["P3.2"],
 a:"As obras ficaram muito interessantes, ao seu gosto. Mas quem compra pode querer personalizar. Se tivesse posto puxadores de luxo de 50 mil euros, acha que alguém os pagava? (Com humor.)",
 steps:["O que gastou deu-lhe conforto durante estes anos. Valorizou a casa, mas não na mesma proporção do investimento."],
 why:"Obras simples (chão, cozinha corrente) valorizam. Acabamentos de luxo desajustados ao segmento não se recuperam."},
{id:"o14",ctx:"Reunião",q:"Não tenho pressa nenhuma.",type:"form",src:["P3.2","P4"],
 a:"Compreendo. Se o mercado na sua zona cresce cerca de [X]% por ano, para a casa valer o que pede faltam cerca de [N] meses. Quer vender hoje pelo valor justo ou esperar esse tempo?",
 steps:["Se a puser hoje à venda com o valor de daqui a três anos, quando ela lá chegar as pessoas vão dizer que já ninguém a quis.","Nesse caso, o meu conselho é não a pôr já à venda. Eu só lhe sou útil se quiser mesmo vender."],
 why:"Quem decide pôr a casa à venda tem algum objetivo; perguntar pelo tempo torna-o claro.",
 next:"Calcule os meses com a ferramenta do separador Método, usando dados oficiais de evolução de preços."},
{id:"o15",ctx:"Reunião",q:"Não quero placa.",type:"form",src:["P2.2"],
 a:"Compreendo. Há alguma coisa que o preocupe em concreto na placa?",
 steps:["(Vizinhos curiosos.) Ainda bem que me diz. Só trazemos quem tem capacidade de compra: qualificamos sempre antes.","Mas se um vizinho quiser comprar para si ou para um filho, não autoriza?","Quanto tempo seria o ideal para vender? Então vamos aproveitar todas as oportunidades e pôr a placa?"],
 why:"Muitas vezes a objeção desfaz-se sozinha. Se for uma questão real de privacidade, aceite: o formador abdicava da placa e nem fotografava a fachada.",
 extra:"Comece pelas cartas aos vizinhos, sem dizer qual é a casa: quem quer trocar liga-lhe a si.",
 warn:"Em casa habitada, o formador só põe a placa depois do prazo de livre resolução (cerca de 14 dias). Confirme o prazo legal."},
{id:"o16",ctx:"Reunião",q:"Também quero pôr a minha placa e vender eu.",type:"form",src:["P2.2"],
 a:"Compreendo. Gostava de lhe perguntar: qual é o benefício que sente na minha ajuda? Sinto que há vontade de continuar a ser o senhor a promover a casa.",
 steps:["A casa está à venda há mais de um ano: o que muda a partir de agora?","Se trouxer o senhor o comprador, já falámos do que acontece (se a agência o permitir). Mas não faz sentido eu investir em fotografias, vídeo e marketing para depois ser o seu número na placa."],
 why:"Esclareça o papel de cada um com perguntas, sem confronto."},
{id:"o17",ctx:"Reunião",q:"Tenho uma amiga interessada, à espera do crédito.",type:"form",src:["P2.2"],
 a:"Compreendo, e é justo que me diga. Proponho avançarmos com o nosso acordo e escrevemos uma exceção: se vender a essa pessoa, não paga qualquer comissão, porque já lhe mostrou a casa antes de mim. Se ela não avançar, já estamos a trabalhar.",
 why:"Remove o obstáculo sem perder tempo."},
{id:"o18",ctx:"Reunião",q:"Quero estar presente nas visitas.",type:"adapt",src:["2.1","2.2","P2.1"],
 a:"Compreendo perfeitamente, a casa é sua. Deixe-me explicar como trabalho: preparo o imóvel antes de cada visita, conheço os pontos fortes e as respostas para as fragilidades que os compradores usam para baixar o preço. Depois de cada visita dou-lhe notícias, e de quinze em quinze dias envio-lhe um resumo. Se quiser estar numa primeira fase, combinamos assim e vemos como corre.",
 why:"Esta vontade nasce muitas vezes quando o consultor, na primeira visita, só apontou defeitos: o proprietário acha que tem de ser ele a vender. Previna-a falando da casa como falaria a um comprador.",
 next:"Mostre o plano de marketing e o calendário de relatórios."},
{id:"o19",ctx:"Reunião",q:"Vamos pensar e depois dizemos alguma coisa.",type:"comp",src:["2.2","4","P2.1"],
 a:"Faz todo o sentido conversarem. Para vos ajudar, há alguma questão que tenha ficado por esclarecer? (ouvir) Proponho então o seguinte: deixo-vos a análise da concorrência e o plano, e falamos amanhã. Dá mais jeito às {hora1} ou às {hora2}?",
 why:"O formador defende fazer tudo na mesma visita e levar sempre o contrato: entre visitas muitos desistem ou entregam a outra agência. Garanta, ao marcar, que estão presentes todos os que decidem.",
 next:"Não saia sem data marcada."},
{id:"o20",ctx:"Reunião",q:"Sente-se, vamos tomar um café primeiro.",type:"form",src:["2.2","P2.1"],
 a:"Agradeço imenso a gentileza. Confesso que achava mais interessante começarmos por visitar o imóvel, porque sem o conhecer não sei o que lhe diga. Se mantiver a proposta, tomamos o café no final, e aí já tenho uma opinião para lhe dar. O que lhe parece?",
 why:"Antes de ver a casa, a conversa vai logo para comissões e exclusividade, fora de ordem. Comece a visita pela sala, onde se recebem as visitas.",
 next:"Percorra a casa vendo-a como a veria um comprador."},
{id:"o21",ctx:"Reunião",q:"(Proprietário mal-educado ou agressivo.)",type:"form",src:["P1.1"],
 a:"(Sorria e mantenha o tom.) Compreendo o que diz. Neste caso, infelizmente, não lhe poderia oferecer os nossos serviços: o que procura não é o que defendemos. Se quiser, deixo-lhe contactos de colegas da zona.",
 why:"Saia de cabeça erguida. Ninguém tem o poder de alterar o seu estado; se precisar de desabafar, faça-o sozinho, nunca com o cliente."},
{id:"o22",ctx:"Reunião",q:"Traga o cliente e, se ele gostar, assinamos depois.",type:"form",src:["1.1","P1.1","P3.1"],
 a:"Com todo o gosto. E quanto à documentação, tem tudo tratado? Se o cliente gostar amanhã, vai querer avançar para o contrato-promessa. Sugiro encontrarmo-nos hoje para analisarmos os documentos e eu conhecer a casa. Dá-lhe mais jeito às 18h00 ou às 19h30?",
 steps:["(Em casa, com tudo visto.) A casa está direitinha e a documentação em ordem. Para amanhã, preciso que assinemos o nosso acordo e a sua autorização para apresentar a casa a este cliente, ou a outros, se este escolher outra."],
 why:"Ao telefone dizem “traga o cliente”; presencialmente, depois de ver a casa e os documentos, a conversa é outra. Nunca mostre um imóvel sem contrato escrito.",
 next:"Se a pessoa não puder hoje, ofereça outros dois horários. Se não houver forma, “não aproveitamos este cliente, virão outros”.",script:"docs"},
{id:"o23",ctx:"Telefone",q:"Isso de ter um cliente, dizem todos.",type:"form",src:["1.1","P1.1"],
 a:"Tem toda a razão em desconfiar. Por isso lhe conto: ontem estive reunido com um casal com dois filhos que procura um {tipologia} até {preco}, perto da escola. A visita está marcada para amanhã às {hora1}. Quer aproveitar esta oportunidade?",
 why:"Contar a história concreta (sem identificar o comprador) dá credibilidade. Dizer apenas “tenho um cliente” não convence.",
 next:"Se aceitar, marque a ida a casa antes da visita.",
 warn:"Só quando é verdade. Nunca invente compradores, visitas ou mandatos."},
{id:"o24",ctx:"Comprador",q:"(Comprador) Quando tiver alguma coisa, ligue-me.",type:"form",src:["1.1","2.1"],
 a:"Prefiro não o deixar à espera. Vamos combinar já: amanhã reunimo-nos aqui e apresento-lhe as possibilidades disponíveis no mercado. Dá-lhe mais jeito às {hora1} ou às {hora2}?",
 why:"Quem procura casa está num momento de mudança e procura ativamente. Se não marcar, vai a outra agência no mesmo dia.",
 next:"Lance de imediato a angariação reativa.",script:"ainda"}
];

/* ---------- Checklist da reunião ---------- */
let PHASES=[
{id:"prep",t:"Preparar",s:"Antes de sair do escritório",items:[
 ["Confirmar a visita no turno anterior","Telefone e, a seguir, mensagem com nome, contacto e hora.","2.1"],
 ["Análise da concorrência impressa","Imóveis comparáveis à venda hoje, com links, área, preço e €/m². Valor médio e desvio-padrão (o formador aceita até cerca de 15%). Em papel timbrado, para oferecer.","2.2"],
 ["Pasta de angariação","Apresentação dos serviços, plano de marketing com o nome do proprietário e do imóvel, testemunhos genuínos.","4"],
 ["Enviar antes a apresentação, se fizer sentido","Inclua perguntas que o proprietário pode querer fazer: experiência no mercado, como vai vender, como avalia, onde promove, de quanto em quanto tempo dá notícias.","4"],
 ["Saber exatamente o que vai oferecer","Liste os serviços que presta mesmo e o benefício de cada um. Nunca prometa o que não faz.","2.2"],
 ["Contrato de mediação na pasta","Minuta validada pelo IMPIC, ou contrato em texto corrido. Leve-o sempre na primeira visita.","3.1"],
 ["Lista dos documentos a pedir","Use a fase “Documentos e contrato” abaixo.","3.2"],
 ["Imagem segura e cuidada","Ir forte, como um bom advogado, e nunca com ar frágil.","2.2"],
 ["Confirmar quem decide", "Casal: os dois presentes. Pais idosos: convidar o filho que decide, mesmo que não assine. Se alguém estiver longe, videochamada.", "P2.1"],
 ["Preço anunciado alto? Levar também a análise do segmento acima", "Para o proprietário ver o que se compra por esse valor.", "P3.2"],
 ["Ter os seus números reais", "Tempo médio de venda dos seus exclusivos, vendas recentes da zona. Só cite o que tiver registado.", "P2.1"],
 ["Plano de serviço pronto a anexar ao acordo", "Para quem já teve uma má experiência: compromisso assinado por si.", "P2.2"]]},
{id:"chegar",t:"Chegar",s:"Os primeiros minutos",items:[
 ["Cumprimentar olhos nos olhos, com um sorriso","Aperto de mão firme, dizer o nome. Não há segunda oportunidade para uma primeira boa impressão.","2.1"],
 ["“Dá-me licença? Com licença.”","","2.1"],
 ["Adiar o café para depois da visita","“Agradeço imenso. Se lhe parecer bem, começamos por ver o imóvel e depois conversamos.”","2.2"],
 ["Postura segura", "Queixo na horizontal, olhar nos olhos, sorriso verdadeiro.", "P2.1"],
 ["Começar a visita pela sala", "É onde se recebem as visitas; depois os espaços mais privados.", "P2.1"]]},
{id:"visita",t:"Percorrer a casa",s:"Criar relação: o proprietário tem de gostar de si",items:[
 ["Falar da casa como falaria a um comprador","Elogie o que é bom: luz, decoração, orientação. Não aponte defeitos para baixar o preço.","2.1"],
 ["Sem prancheta nem checklist à vista","A grelha técnica fica para depois de angariar. Agora o foco é a pessoa.","2.2"],
 ["Ficar à direita do proprietário","Técnica de PNL defendida pelo formador: a direita está associada ao futuro. Se a pessoa for “invertida”, fique à esquerda.","2.1"],
 ["Anotar mentalmente forças e fragilidades","Para a análise SWOT: o que distingue a casa e o que os compradores vão usar para pedir desconto.","2.2"],
 ["Perceber a motivação e o preço","“Como chegou a esse valor? Que ideia tem da venda?” Ajuda a perceber a flexibilidade.","2.1"],
 ["Casal: o mesmo olhar e interesse para os dois", "Se um deles não gostar de si, não há acordo.", "P2.1"],
 ["Linguagem", "“Acolhedora”, “confortável”, “interessante”. Sem diminutivos. Não mencione defeitos: ficam para a SWOT.", "P1.1"]]},
{id:"reuniao",t:"Apresentar o serviço",s:"Sentados à mesa: dar razões para o escolherem",items:[
 ["Transição para a mesa","“A casa é muito interessante, obrigado por me receber. Seria útil conversarmos uns minutos: dava-lhe a minha opinião sobre o que ajudaria a vender mais rápido. Podemos usar a mesa da sala?”","2.2"],
 ["Oferecer a análise da concorrência","“É uma oferta minha, independentemente de trabalharmos juntos.” Pergunte se sabia quantos imóveis competem com o dele.","4"],
 ["Apresentar as duas formas de trabalhar","Uma sem compromisso de parte a parte, e o serviço diferenciado. Sem dizer “exclusivo”.","2.2"],
 ["Análise SWOT","Pontos fortes para a publicidade; fragilidades convertidas em oportunidades (ex.: portas da cozinha).","2.2"],
 ["Relatório de avaliação, com as três razões","Para o proprietário (preço justo), para os compradores (justifica o valor) e para si (não aceita imóveis fora do segmento).","2.2"],
 ["Home staging","Preparar a casa com o que existe, sem obras.","2.2"],
 ["Reportagem fotográfica","Grande angular. O objetivo é prender o comprador até à 5.ª fotografia.","2.2"],
 ["Vídeo imobiliário","Percurso como numa visita real, para criar o desejo de visitar.","2.2"],
 ["Plano de marketing semana a semana","Inclui a apresentação à equipa, cartas na vizinhança, portais e redes. Relatório de 15 em 15 dias e reunião mensal.","2.2"],
 ["Apoios incluídos (se os tiver)","Jurídico (contrato-promessa), fiscal, crédito e acompanhamento até à escritura.","2.2"],
 ["Honorários sem pausas", "Apresente-os enquanto preenchem o acordo, sem “parece-lhe bem?”. Ver guião “Apresentar os honorários”.", "P3.1"]]},
{id:"fecho",t:"Fechar",s:"As quatro perguntas, por esta ordem",items:[
 ["1. “Quando pensa na mediação imobiliária, pensa em tudo isto que lhe apresentei?”","Esperado: não. Quebra a crença de que “são todos iguais”.","2.2"],
 ["2. “Gostou? Acrescentaria algo mais para que este serviço fosse cinco estrelas para si?”","Esperado: não. É o proprietário a dizer que o serviço é excelente.","2.2"],
 ["3. “E quanto a mim, acha que estou à altura para o representar na venda da sua casa?”","Esperado: sim.","2.2"],
 ["4. “Fico muito feliz. Gostaria de lhe perguntar se confia apenas a mim a venda do seu imóvel?”","“Apenas” substitui a palavra “exclusivo”.","2.2"],
 ["Os quatro critérios","“Só oferecemos este serviço quando gostamos do imóvel, a documentação está em ordem, o preço está ajustado ao segmento e o proprietário valoriza este tipo de serviço.”","2.2"],
 ["“Vamos então fazer o nosso acordo?”","Peça o cartão de cidadão e preencham o contrato em conjunto, lendo-o juntos.","2.2"],
 ["Se disser “não quero exclusividade”", "Pergunte o que o preocupa em concreto e siga o caminho da causa (separador Objeções).", "P2.2"],
 ["Se reclamar da comissão ou do preço", "Escute em silêncio, diga “compreendo” e continue com perguntas, nunca com argumentos.", "P3.1"]]},
{id:"docs",t:"Documentos e contrato",s:"Confirme antes de promover",items:[
 ["Caderneta predial (Portal das Finanças)","Atenção: uma garagem que é fração autónoma tem caderneta própria.","3.1"],
 ["Certidão permanente do registo predial","É o documento que confirma os titulares. Veja os ónus: hipoteca, penhoras, usufruto, direito de superfície.","3.2"],
 ["Certificado energético","Obrigatório para promover, salvo as isenções previstas.","3.2"],
 ["Licença de utilização ou documento equivalente","Prédios anteriores a 7 de agosto de 1951: averbamento ou certidão da Câmara. O formador aconselha manter este cuidado mesmo quando a escritura já não o exige.","3.1"],
 ["Ficha técnica da habitação","Quando aplicável.","3.2"],
 ["Condomínio","Quotas em dívida e obras ou quotas extra já aprovadas.","3.2"],
 ["Identificação dos proprietários","Estado civil (assinatura do cônjuge), herdeiros, menores, procurações. Comprovativo da profissão para a prevenção do branqueamento de capitais.","3.2"],
 ["Direitos de preferência","Inquilino, confinantes e outros. Planeie a comunicação.","3.2"],
 ["Contratos de mediação já em vigor","Um contrato em exclusivo não produz efeito sobre contratos em aberto ainda válidos.","3.1"],
 ["Contrato de mediação preenchido","Regime (exclusivo ou não), prazo, remuneração, ónus e dívida, identificação do imóvel. Assinado pelo representante legal da empresa.","3.2"]]},

 ["Cartas na vizinhança","Ver o guião “Acabei de angariar”.","1.2"],
 ["Marcar home staging, fotografias e vídeo","","2.2"],
 ["Procurar mais dois imóveis no mesmo subsegmento","Para ter sempre três para mostrar a quem ligar.","1.2"],

 ["Enviar o cartão virtual por WhatsApp", "", "P1.1"],
 ["Registar a data do contrato", "Quando vender, registe os dias até à venda e a margem negocial. São os números que vai poder mostrar.", "P2.1"]]}
];

/* ---------- Treino: perguntas ---------- */
let QUIZ=[
{q:"Ao telefone, o proprietário diz: “Não quero trabalhar com imobiliárias.” O que recomenda o formador?",o:["Insistir nas vantagens da exclusividade até ele mudar de ideias.","Desejar-lhe sucesso, pôr-se ao dispor, dizer o nome e pedir para ligar daqui a 30 dias.","Desligar educadamente e riscar o contacto.","Oferecer logo uma comissão mais baixa."],c:1,e:"Psicologia inversa: ele espera uma má reação. Fica a porta aberta e o imóvel registado para quando tiver um comprador.",s:"1.1"},
{q:"No fim do primeiro telefonema, como deve propor a reunião?",o:["“Quando é que lhe dá jeito?”","“Posso passar aí um dia destes?”","Dar duas opções de horário seguidas, sem fazer pausa antes.","Pedir o email para enviar informação."],c:2,e:"Quem marca é sempre o consultor. Uma pausa antes das opções convida ao “não”.",s:"2.1"},
{q:"Um casal quer um T3 no centro por 300 mil euros e esse imóvel não existe no mercado. O que faz?",o:["Diz-lhes que vão ter de ir para a periferia.","Valida as razões deles e pergunta se preferem um T2 no centro ou um T3 a dez minutos.","Diz que liga quando surgir algo.","Mostra-lhes um T3 de 375 mil euros para os convencer."],c:1,e:"É a técnica das perguntas alternativas: as duas opções são realistas e a escolha é deles. Termine com “O que lhe parece?”.",s:"1.1"},
{q:"Marcou uma visita com um comprador para amanhã e não tem o imóvel. Qual é o primeiro passo?",o:["Ligar logo a colegas de outras marcas para partilhar.","Mensagem “SOS” no grupo dos colegas da própria agência.","Pôr um anúncio a dizer que procura imóveis.","Esperar que algum proprietário ligue."],c:1,e:"A ordem é: colegas da agência, proprietários que disseram não, prospeção e cartas no local e, só no fim, partilha com outras marcas (50% da comissão).",s:"1.1"},
{q:"Chega a casa do proprietário e ele convida-o a sentar-se para um café. O que faz?",o:["Aceita e começa a explicar as comissões.","Agradece e propõe ver primeiro a casa; o café fica para depois.","Recusa sem explicar.","Abre logo a checklist técnica."],c:1,e:"Sem ter visto a casa, a conversa vai para comissões e exclusividade fora de ordem.",s:"2.2"},
{q:"Durante a visita à casa, qual é a atitude certa?",o:["Apontar defeitos para preparar uma descida de preço.","Ver a casa como a veria um comprador e elogiar o que tem de bom.","Preencher a grelha técnica com cuidado.","Falar já da duração do contrato."],c:1,e:"Ninguém entrega em exclusivo a quem não gosta. Apontar defeitos também faz o proprietário querer estar em todas as visitas.",s:"2.1"},
{q:"O que é a análise da concorrência que leva para a reunião?",o:["Os preços a que se venderam casas na zona.","Os imóveis comparáveis que estão à venda hoje.","Uma avaliação certificada.","O valor patrimonial tributário."],c:1,e:"Mostra com que imóveis o proprietário vai competir. Não é uma avaliação. Pode oferecê-la logo no início da conversa.",s:"2.2"},
{q:"Como deve apresentar os regimes de contrato?",o:["“Eu só trabalho em exclusivo.”","“Há duas formas de trabalhar com a mediação: uma sem compromisso de parte a parte e um serviço diferente que lhe quero mostrar.”","Não falar disso até ao fim.","Propor primeiro o contrato em aberto."],c:1,e:"A escolha fica com o proprietário e ele deixa de estar na defensiva. As palavras “exclusivo” e “não exclusivo” não se usam.",s:"2.2"},
{q:"Qual é a ordem das perguntas de fecho?",o:["Confia apenas a mim → gostou → estou à altura → pensa em tudo isto.","Pensa em tudo isto → acrescentaria algo → estou à altura → confia apenas a mim.","Estou à altura → confia apenas a mim → assinamos.","Gostou → assinamos o exclusivo?"],c:1,e:"Primeiro desmontam-se as crenças, depois é o proprietário a dizer que o serviço é excelente, depois a confiança em si e, só no fim, o pedido.",s:"2.2"},
{q:"Quais são as três razões do relatório de avaliação?",o:["Para o proprietário, para os compradores e para o próprio consultor.","Para o banco, para as Finanças e para o notário.","Só para justificar a comissão.","Para cumprir a lei."],c:0,e:"O proprietário fica a saber o preço justo, os compradores têm de justificar as propostas baixas e o consultor não aceita imóveis acima do segmento.",s:"2.2"},
{q:"Acabou de angariar um T2 entre 250 e 300 mil euros. Qual é a preocupação seguinte?",o:["Só publicitar este imóvel.","Angariar mais dois imóveis no mesmo subsegmento.","Baixar o preço para vender depressa.","Partilhar com todas as agências."],c:1,e:"O consultor pesca “à rede”: quem liga por um imóvel deve ter três para ver. Roda-se a publicidade entre eles.",s:"1.2"},
{q:"Um cliente comprou casa consigo há um mês. O que recomenda o formador?",o:["Nada: o negócio está fechado.","Uma mensagem automática da empresa.","Ligar, perguntar como está e passar lá com um presente.","Pedir logo referências."],c:2,e:"No dia da escritura um presente não surpreende. Um mês depois, supera a expectativa.",s:"1.1"},
{q:"Tem uma reunião no sábado às 11h. Quando confirma?",o:["No sábado de manhã.","Na sexta à tarde.","Não confirma, para não dar hipótese de desmarcar.","Na quinta-feira."],c:1,e:"Confirme no turno útil anterior e, se houver contratempo, ajuste com simpatia.",s:"2.1"},
{q:"O proprietário tem o imóvel em aberto em duas agências, com contratos válidos, e quer dar-lhe exclusividade. O que deve saber?",o:["Pode assinar o exclusivo e os outros deixam de contar.","O exclusivo só produz efeito depois de rescindidos os contratos em vigor.","Basta pôr no contrato uma data posterior.","Deve dizer às agências que o imóvel já está vendido."],c:1,e:"Segundo o formador (que cita o IMPIC), o exclusivo sobre contratos válidos não tem eficácia. A rescisão deve ser feita com verdade.",s:"3.1"},
{q:"O que é obrigatório numa carta deixada debaixo das portas?",o:["Apenas o nome do consultor.","A denominação da empresa e o número da licença AMI.","Uma fotografia do consultor.","O preço do imóvel."],c:1,e:"Vale para qualquer comunicação: cartas, emails, placas, envelopes. O formador refere coimas por incumprimento.",s:"1.2"},
{q:"Na reunião, o proprietário diz “isso é exclusividade, não quero”. Qual é o primeiro passo?",o:["Explicar porque é que o exclusivo é melhor para ele.","Dizer que o vosso exclusivo é só de promoção.","Dizer “compreendo” e perguntar o que o preocupa em concreto no regime de exclusividade.","Aceitar logo fazer em aberto."],c:2,e:"Por trás do “não quero exclusivo” há uma causa: quer rapidez, quer poder vender ele próprio ou teve uma má experiência. Só depois de a conhecer pode responder ao que interessa.",s:"P2.2"},
{q:"Qual é a diferença entre dizer “compreendo” e dizer “concordo”?",o:["Nenhuma, são sinónimos.","“Compreendo” põe-no do lado da pessoa sem dizer que ela tem razão.","“Concordo” é mais simpático e por isso é preferível.","“Compreendo” soa a frio e deve ser evitado."],c:1,e:"Ninguém reage mal a “compreendo”. “Concordo” daria razão à pessoa e tiraria o sentido à sua chamada.",s:"P1.1"},
{q:"Ao apresentar os honorários, o que deve evitar?",o:["Dizer a percentagem.","Fazer uma pausa ou perguntar “parece-lhe bem?” depois do valor.","Explicar quando é pago.","Falar do prazo do acordo."],c:1,e:"Apresente com segurança e continue. Uma pausa ou um pedido de aprovação convida a pessoa a discordar.",s:"P3.1"},
{q:"O proprietário diz que 3% é o justo. Qual é a pergunta seguinte que o formador recomenda?",o:["“3% é muito pouco para o meu trabalho.”","“Como chegou a esse valor? Porquê 3% e não 2% ou 4%?”","“Então faço 4%.”","“Os outros não fazem nada.”"],c:1,e:"A pergunta leva-o a dizer que é o que outros cobram. A seguir pergunta, um a um, se esses colegas incluíam análise da concorrência, SWOT, relatório e home staging.",s:"P3.1"},
{q:"O proprietário quer pôr a casa 20% acima do valor do segmento. O que leva para a reunião?",o:["Só a análise da concorrência do segmento certo.","A análise do segmento certo e também a do segmento acima, para lhe perguntar se compraria a casa dele em vez das outras.","Nada: deixa-o pôr o preço que quer.","Uma lista de defeitos da casa."],c:1,e:"Ao ver o que se vende pelo valor que ele quer (maior, mais novo, com garagem), é o próprio proprietário que conclui.",s:"P3.2"},
{q:"O proprietário teve uma má experiência com um exclusivo. O que propõe o formador?",o:["Dizer que você é diferente e pedir que confie.","Criticar a agência anterior.","Perguntar se ficaria satisfeito se cumprisse tudo e propor anexar o plano ao acordo, com a possibilidade de o terminar se não cumprir.","Fazer um contrato de um mês."],c:2,e:"Se dá a sua palavra, o que lhe custa assiná-la? Ele deixa de arriscar.",s:"P2.2"},
{q:"Ao telefone, o proprietário avisa: “exclusividade não dou a ninguém”. O que faz?",o:["Explica as vantagens do exclusivo ao telefone.","Diz que trabalha das duas formas, que ele decide o que acha melhor, e propõe dois horários.","Desliga, porque só trabalha em exclusivo.","Diz “depois falamos disso aí”."],c:1,e:"Ao telefone discutir o exclusivo é perder. O objetivo é a reunião. (Só diga que trabalha das duas formas se a sua agência o permitir.)",s:"P1.2"},
{q:"Quais são os rácios mínimos que o formador considera aceitáveis?",o:["5% dos contactos dão visita e 10% das visitas dão contrato.","20% dos contactos dão visita e 30% das visitas dão contrato.","50% e 50%.","Não há mínimos."],c:1,e:"Abaixo disso, reveja a forma de abordar. Com 20% e 30%, a conversão global ronda os 6%.",s:"P1.2"},
{q:"A sala é pequena. Como fala dela com o proprietário?",o:["“A salinha é um bocadinho pequena.”","“É um salão!”","“Não é muito grande, mas é muito acolhedora e permite dois ambientes.”","Não fala da sala."],c:2,e:"Não mente nem aponta defeitos. Evite diminutivos (“salinha”), que fazem parecer tudo mais pequeno.",s:"P2.1"},
{q:"Quantas etapas são precisas, normalmente, para ultrapassar o “não quero imobiliária”?",o:["Uma: insistir até aceitar.","Duas: primeiro deixar a porta aberta com simpatia e ajuda; depois voltar a ligar quando tiver um comprador real.","Três: email, carta e visita.","É impossível ultrapassar."],c:1,e:"É a objeção mais difícil e não se resolve num só contacto.",s:"P1.1"}
];

/* ---------- Utilitários ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function val(k){return (store.me[k]!==undefined?store.me[k]:store.sit[k])||""}
function fillHTML(t){return esc(t).replace(/\{(\w+)\}/g,(m,k)=>{if(!PH[k])return m;const v=val(k);return v?`<mark class="ph">${esc(v)}</mark>`:`<mark class="ph empty">[${PH[k]}]</mark>`})}
function fillText(t){return t.replace(/\{(\w+)\}/g,(m,k)=>PH[k]?(val(k)||`[${PH[k]}]`):m)}
function srcBadges(arr){return (arr||[]).filter(s=>SRC[s]).map(s=>`<span class="badge b-src">${SRC[s]}</span>`).join("")}
function typeBadge(t){const [c,l]=TYPE[t]||TYPE.own;return `<span class="badge ${c}">${l}</span>`}
const ICON={warn:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>',
 info:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>',
 copy:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
 chev:'<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'};
let toastT;
function toast(msg){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,1800)}
function copy(text,btn){
  const done=()=>toast("Texto copiado");
  try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("Selecione o texto e copie manualmente")}ta.remove()}
}

 ["treino","Treino",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>'],

function buildNav(){
  const h=VIEWS.map(([id,l,ic])=>`<button class="tab" type="button" data-view="${id}">${ic}<span>${l}</span></button>`).join("");
  $("#tabsTop").innerHTML=h;$("#tabsBottom").innerHTML=h;
  document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{location.hash=b.dataset.view}));
}
