# /etc/nginx/sites-available/orcamento.valormaximo.pt
# Depois de ativar: sudo certbot --nginx -d orcamento.valormaximo.pt
server {
    listen 80;
    listen [::]:80;
    server_name orcamento.valormaximo.pt;

    client_max_body_size 30M;   # anexos (fotos de faturas, PDF)

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # atualizações em tempo real (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }
}
